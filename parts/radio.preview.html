<div class="pad">
  <div class="lbl">Group · one name = one mutually-exclusive set (the probe is the checked option)</div>
  <div class="stack" role="radiogroup" aria-label="Activity mode">
    <aha-radio data-probe name="mode" value="poll" checked>Poll</aha-radio>
    <aha-radio name="mode" value="quiz">Quiz</aha-radio>
    <aha-radio name="mode" value="wordcloud">Word cloud</aha-radio>
  </div>

  <div class="lbl">Button variant · segmented connected pills</div>
  <div class="row" role="radiogroup" aria-label="View" style="gap:0">
    <aha-radio name="view" value="grid" variant="button" checked>Grid</aha-radio>
    <aha-radio name="view" value="list" variant="button">List</aha-radio>
    <aha-radio name="view" value="board" variant="button">Board</aha-radio>
  </div>

  <div class="lbl">Small size · disabled states</div>
  <div class="row">
    <aha-radio name="sz" value="a" size="small" checked>Small on</aha-radio>
    <aha-radio name="sz" value="b" size="small">Small off</aha-radio>
    <aha-radio name="lock" value="on" disabled checked>Locked on</aha-radio>
    <aha-radio name="lock2" value="off" disabled>Locked off</aha-radio>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-radio.js) — no inlined copy, so the preview can
     never drift from lib/. The playground control bar (Variant / Direction / Size + disabled) is
     generated from contracts/radio.json → playground and drives the probe's attributes live. -->
<script type="module">
  import '../lib/aha-radio.js';   // registers <aha-radio> — the shipped primitive, byte-identical to what consumers get
</script>
