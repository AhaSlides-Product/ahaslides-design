<div class="pad">
  <div class="lbl">Radio group</div>
  <div class="stack" role="radiogroup" aria-label="Activity mode">
    <aha-radio data-probe name="mode" value="poll" checked>Poll</aha-radio>
    <aha-radio name="mode" value="quiz">Quiz</aha-radio>
    <aha-radio name="mode" value="wordcloud">Word cloud</aha-radio>
  </div>

  <div class="lbl">Button style</div>
  <div class="row" role="radiogroup" aria-label="View" style="gap:0">
    <aha-radio name="view" value="grid" variant="button" checked>Grid</aha-radio>
    <aha-radio name="view" value="list" variant="button">List</aha-radio>
    <aha-radio name="view" value="board" variant="button">Board</aha-radio>
  </div>

  <div class="lbl">Card style</div>
  <div class="stack" role="radiogroup" aria-label="Plan" style="max-width:360px">
    <aha-radio data-card-probe name="plan" value="pro" variant="card" checked
      description="Best for teams — unlimited slides and live results.">Pro</aha-radio>
    <aha-radio name="plan" value="essential" variant="card"
      description="For solo creators getting started.">Essential</aha-radio>
    <aha-radio name="plan" value="free" variant="card">Free</aha-radio>
  </div>

  <div class="lbl">Help "?" and locked crown after the label</div>
  <div class="stack" role="radiogroup" aria-label="Export format">
    <aha-radio name="exp" value="pdf" checked help="A print-ready file with every slide.">PDF</aha-radio>
    <aha-radio name="exp" value="csv" help="Responses only, one row per participant.">Spreadsheet</aha-radio>
    <aha-radio name="exp" value="video" locked plan="pro" feature-key="export_video" upgrade-body="Export your deck as a video.">Video</aha-radio>
  </div>

  <div class="lbl">Help and locked on the card and button variants</div>
  <div class="stack" role="radiogroup" aria-label="Plan" style="max-width:360px">
    <aha-radio name="plan2" value="a" variant="card" checked help="Billed yearly." description="For teams.">Team</aha-radio>
    <aha-radio name="plan2" value="b" variant="card" locked plan="pro" feature-key="sso" upgrade-body="Single sign-on for your organisation." description="Sign in with your company account.">Single sign-on</aha-radio>
  </div>
  <div class="row" role="radiogroup" aria-label="View" style="gap:0;margin-top:12px">
    <aha-radio name="view2" value="grid" variant="button" checked help="Thumbnails in a grid.">Grid</aha-radio>
    <aha-radio name="view2" value="list" variant="button" help="One slide per row.">List</aha-radio>
    <aha-radio name="view2" value="board" variant="button" locked plan="pro" feature-key="board">Board</aha-radio>
  </div>

  <div class="lbl">Small and disabled</div>
  <div class="row">
    <aha-radio name="sz" value="a" size="small" checked>Small on</aha-radio>
    <aha-radio name="sz" value="b" size="small">Small off</aha-radio>
    <aha-radio name="lock" value="on" disabled checked>Locked on</aha-radio>
    <aha-radio name="lock2" value="off" disabled>Locked off</aha-radio>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-radio.js) — no inlined copy, so the preview can
     never drift from lib/. The playground control bar (Variant / Direction / Size + disabled) is
     generated from contracts/radio.json → playground and drives the probe's attributes live. -->
<script type="module">
  import '../lib/aha-radio.js';   // registers <aha-radio> — the shipped primitive, byte-identical to what consumers get
</script>
