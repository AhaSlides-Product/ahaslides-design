<div class="pad">
  <div class="lbl">Focus a field — the counter appears only while focused, hidden at rest</div>
  <div class="row">
    <aha-counted-input data-probe status="error" maxlength="80" value="Too long an answer" placeholder="Answer"></aha-counted-input>
    <aha-counted-input maxlength="40" value="Paris" placeholder="Option text"></aha-counted-input>
    <aha-counted-input maxlength="80" placeholder="Click to focus — counter shows"></aha-counted-input>
  </div>
  <div class="lbl">States</div>
  <div class="row">
    <aha-counted-input maxlength="none" placeholder="No maxlength — no counter"></aha-counted-input>
    <aha-counted-input disabled maxlength="40" value="Locked value"></aha-counted-input>
    <aha-counted-input readonly maxlength="40" value="Read-only"></aha-counted-input>
  </div>
  <div class="lbl">Types, phone keyboard and direction</div>
  <div class="row">
    <aha-counted-input type="email" maxlength="none" value="name@example.com"></aha-counted-input>
    <aha-counted-input type="url" maxlength="none" value="https://ahaslides.com"></aha-counted-input>
    <aha-counted-input type="password" maxlength="none" value="access-code"></aha-counted-input>
    <aha-counted-input inputmode="decimal" maxlength="none" value="1e" placeholder="Amount"></aha-counted-input>
    <aha-counted-input dir="auto" maxlength="60" value="مرحبا بالجميع"></aha-counted-input>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-counted-input.js) — no inlined copy, so the preview
     can never drift from lib/, and qa measures exactly what consumers get. -->
<script type="module">
  import '../lib/aha-counted-input.js';   // registers <aha-counted-input> — the shipped primitive
</script>
