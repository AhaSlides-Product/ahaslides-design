<div class="pad">
  <div class="lbl">Initials · sizes 32 / 40 / 56</div>
  <div class="row" style="align-items:center;gap:12px">
    <aha-avatar name="Ada Lovelace" size="32"></aha-avatar>
    <aha-avatar data-probe name="Grace Hopper"></aha-avatar>
    <aha-avatar name="Alan Turing" size="56"></aha-avatar>
  </div>
  <div class="lbl">Shape · circle · square</div>
  <div class="row" style="align-items:center;gap:12px">
    <aha-avatar name="Round One"></aha-avatar>
    <aha-avatar name="Square Two" shape="square"></aha-avatar>
  </div>
</div>

<script type="module">
const STYLE = `
  :host{ display:inline-flex }
  .avatar{ box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; overflow:hidden;
    width:40px; height:40px; border-radius:var(--aha-radius-pill,999px);
    background:var(--aha-bg-accent,#F9F5FF); color:var(--aha-purple-60,#6A1EBB);
    font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif); font-weight:600; font-size:15px; line-height:1;
    user-select:none }
  :host([shape="square"]) .avatar{ border-radius:var(--aha-radius-default,8px) }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block }
`;
function initials(name){ const p=String(name).trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; if(p.length===1) return p[0].slice(0,2).toUpperCase(); return (p[0][0]+p[p.length-1][0]).toUpperCase(); }
class AhaAvatar extends HTMLElement {
  get name(){ return this.getAttribute('name')||''; }
  get src(){ return this.getAttribute('src')||''; }
  get size(){ return parseInt(this.getAttribute('size')||'40',10); }
  connectedCallback(){
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    const size=this.size;
    const inner = this.src ? `<img src="${this.src}" alt="${this.name}"/>` : `<span>${initials(this.name)}</span>`;
    this.shadowRoot.innerHTML = `<style>${STYLE}</style><span class="avatar" role="img" aria-label="${this.name||'avatar'}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px">${inner}</span>`;
  }
}
customElements.define('aha-avatar', AhaAvatar);
</script>
