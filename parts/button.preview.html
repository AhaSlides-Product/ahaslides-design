<div class="pad">
  <div class="lbl">Variants (md)</div>
  <div class="row">
    <aha-button variant="primary" size="md">Primary</aha-button>
    <aha-button variant="secondary" size="md">Secondary</aha-button>
    <aha-button variant="tertiary" size="md">Tertiary</aha-button>
    <aha-button variant="danger" size="md">Danger</aha-button>
    <aha-button variant="link" size="md">Link</aha-button>
  </div>

  <div class="lbl">Sizes (primary)</div>
  <div class="row" style="align-items:center">
    <aha-button variant="primary" size="sm">Small</aha-button>
    <aha-button variant="primary" size="md">Medium</aha-button>
    <aha-button variant="primary" size="lg">Large</aha-button>
    <aha-button variant="primary" size="xl">Extra large</aha-button>
  </div>

  <div class="lbl">Icon · loading · disabled</div>
  <div class="row" style="align-items:center">
    <aha-button variant="primary" size="md"><span slot="icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>New slide</aha-button>
    <aha-button variant="secondary" size="md" loading>Saving</aha-button>
    <aha-button variant="primary" size="md" disabled>Disabled</aha-button>
    <aha-button variant="secondary" size="md" disabled>Disabled</aha-button>
  </div>
</div>

<script type="module">
import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';
class AhaButton extends LitElement {
  static properties = {
    variant: { type: String, reflect: true }, size: { type: String, reflect: true },
    disabled: { type: Boolean, reflect: true }, loading: { type: Boolean, reflect: true }, block: { type: Boolean, reflect: true },
  };
  constructor(){ super(); this.variant='secondary'; this.size='md'; this.disabled=false; this.loading=false; this.block=false; }
  static styles = css`
    :host{ display:inline-block }
    :host([block]){ display:block }
    button{
      font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif); font-weight:600; font-size:14px; line-height:1.5;
      display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; box-sizing:border-box;
      height:36px; padding:0 16px; border:1px solid transparent; border-radius:var(--aha-radius-default,8px);
      background:var(--aha-btn-secondary-bg,#fff); color:var(--aha-text-default,#1A1A1A); border-color:var(--aha-btn-secondary-border,#E3E3E3);
      cursor:pointer; white-space:nowrap; user-select:none; transition:background .12s ease, border-color .12s ease, opacity .12s ease }
    button:focus-visible{ outline:2px solid var(--aha-color-primary,#6A1EBB); outline-offset:2px }
    /* sizes — measured DS V3 heights/radius/fontSize */
    :host([size=sm]) button{ height:28px; padding:0 8px; border-radius:var(--aha-radius-xs,4px); font-size:14px }
    :host([size=md]) button{ height:36px; padding:0 16px; border-radius:var(--aha-radius-default,8px); font-size:14px }
    :host([size=lg]) button{ height:40px; padding:0 20px; border-radius:var(--aha-radius-default,8px); font-size:16px }
    :host([size=xl]) button{ height:52px; padding:0 20px; border-radius:var(--aha-radius-lg,12px); font-size:16px }
    /* variants */
    :host([variant=primary]) button{ background:var(--aha-btn-primary-bg,#6A1EBB); border-color:var(--aha-btn-primary-bg,#6A1EBB); color:var(--aha-btn-primary-fg,#fff) }
    :host([variant=primary]) button:hover{ background:var(--aha-btn-primary-bg-hover,#621BAF); border-color:var(--aha-btn-primary-bg-hover,#621BAF) }
    :host([variant=primary]) button:active{ background:var(--aha-btn-primary-bg-press,#5715A0); border-color:var(--aha-btn-primary-bg-press,#5715A0) }
    :host([variant=secondary]) button:hover{ background:var(--aha-btn-secondary-bg-hover,#F7F7F7) }
    :host([variant=secondary]) button:active{ border-color:var(--aha-btn-secondary-border-press,#D4D4D4) }
    :host([variant=tertiary]) button{ background:transparent; border-color:transparent; color:var(--aha-text-default,#1A1A1A) }
    :host([variant=tertiary]) button:hover{ background:var(--aha-btn-tertiary-bg-hover,#F7F7F7) }
    :host([variant=danger]) button{ background:var(--aha-btn-danger-bg,#F5222D); border-color:var(--aha-btn-danger-bg,#F5222D); color:#fff }
    :host([variant=danger]) button:hover{ background:var(--aha-btn-danger-bg-hover,#FF4D4F); border-color:var(--aha-btn-danger-bg-hover,#FF4D4F) }
    :host([variant=link]) button{ background:transparent; border-color:transparent; color:var(--aha-text-link,#6A1EBB); font-weight:400; padding:0 4px }
    :host([variant=link]) button:hover{ text-decoration:underline }
    /* disabled */
    :host([disabled]) button{ cursor:not-allowed; background:var(--aha-btn-disabled-bg,#E3E3E3); border-color:var(--aha-btn-disabled-bg,#E3E3E3); color:var(--aha-btn-disabled-fg,#B5B5B5) }
    :host([disabled][variant=tertiary]) button, :host([disabled][variant=link]) button{ background:transparent; border-color:transparent }
    :host([loading]) button{ cursor:progress }
    .spin{ animation:aha-spin .7s linear infinite }
    @keyframes aha-spin{ to{ transform:rotate(360deg) } }
    ::slotted([slot=icon]){ display:inline-flex; line-height:0 }
  `;
  _click(e){ if(this.disabled || this.loading){ e.preventDefault(); e.stopImmediatePropagation(); } }
  render(){
    const lead = this.loading
      ? html`<svg class="spin" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="28" stroke-dashoffset="10"/></svg>`
      : html`<slot name="icon"></slot>`;
    return html`<button ?disabled=${this.disabled} @click=${this._click}>${lead}<slot></slot></button>`;
  }
}
customElements.define('aha-button', AhaButton);
</script>
