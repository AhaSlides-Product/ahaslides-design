<div class="pad">
  <div class="lbl">Card · cover · title + extra action · body · footer actions · hoverable</div>
  <div class="row" style="align-items:stretch">
    <aha-card data-probe card-title="Live poll" hoverable style="width:300px">
      <img slot="cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'300'%20height%3D'120'%3E%3Crect%20width%3D'300'%20height%3D'120'%20fill%3D'%23F9F5FF'%2F%3E%3C%2Fsvg%3E" alt="" />
      <a slot="extra" href="#" style="color:var(--aha-text-link,#6A1EBB);text-decoration:none;font-size:14px">Edit</a>
      Which release cadence works best for your team this quarter?
      <div slot="actions">
        <aha-icon name="system-share-network" size="16" aria-hidden="true"></aha-icon>
        <aha-icon name="system-bookmark-simple" size="16" aria-hidden="true"></aha-icon>
      </div>
    </aha-card>
    <aha-card size="small" card-title="Weekly digest" style="width:240px">A small card tightens its padding. One idea per card.</aha-card>
    <aha-card bordered="false" card-title="Borderless" style="width:240px">No outline — a flat surface that leans on the page background.</aha-card>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-card.js) + the icon library — no inlined copy, so the
     preview can never drift from lib/. The playground control bar (Size / Bordered / Hoverable) is
     generated from contracts/card.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';      // registers <aha-icon> so the footer action glyphs resolve from the DS library
  import '../lib/aha-card.js';   // registers <aha-card> — the shipped primitive, byte-identical to what consumers get
</script>
