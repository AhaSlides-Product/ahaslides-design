<div class="pad">
  <div class="lbl">Colour presets · filled</div>
  <div class="row">
    <aha-tag>Draft</aha-tag>
    <aha-tag data-probe color="primary" icon="system-tag">Poll</aha-tag>
    <aha-tag color="success" icon="system-check">Published</aha-tag>
    <aha-tag color="processing">Scheduled</aha-tag>
    <aha-tag color="warning">Review</aha-tag>
    <aha-tag color="error">Archived</aha-tag>
  </div>
  <div class="lbl">Bordered (outlined) · leading icon</div>
  <div class="row">
    <aha-tag bordered>Draft</aha-tag>
    <aha-tag bordered color="primary" icon="system-star">Featured</aha-tag>
    <aha-tag bordered color="success">Live</aha-tag>
    <aha-tag bordered color="error">Blocked</aha-tag>
  </div>
  <div class="lbl">Closable keywords · animates out on ✕</div>
  <div class="row">
    <aha-tag closable color="primary">Marketing</aha-tag>
    <aha-tag closable>Q&amp;A</aha-tag>
    <aha-tag closable icon="system-tag">Word cloud</aha-tag>
  </div>
  <div class="lbl">Checkable toggle · aria-pressed</div>
  <div class="row">
    <aha-tag checkable checked>Poll</aha-tag>
    <aha-tag checkable>Quiz</aha-tag>
    <aha-tag checkable icon="system-check">Survey</aha-tag>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-tag.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Colour / Bordered /
     Closable · Checkable) is generated from contracts/tag.json → playground and drives the
     [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/icons.js';     // registers <aha-icon> so leading + close glyphs resolve from the DS library
  import '../lib/aha-tag.js';   // registers <aha-tag> — the shipped primitive, byte-identical to what consumers get
</script>
