<div class="pad">
  <div class="lbl">Line, steps and circle</div>
  <div style="display:flex; flex-direction:column; gap:16px; max-width:360px">
    <aha-progress data-probe percent="60"></aha-progress>
    <aha-progress percent="40" status="warning"></aha-progress>
    <aha-progress percent="100" status="success"></aha-progress>
    <aha-progress percent="30" status="error"></aha-progress>
    <aha-progress size="small" percent="50"></aha-progress>
    <aha-progress steps="5" percent="60"></aha-progress>
    <div style="display:flex; gap:24px; align-items:center">
      <aha-progress type="circle" percent="75"></aha-progress>
      <aha-progress type="circle" percent="100" status="success"></aha-progress>
      <aha-progress type="circle" size="small" percent="45"></aha-progress>
    </div>
  </div>
  <div class="lbl">Audience: palette="deck" on a dark deck (applyDeck() with a white ink and a Vivid Pink accent)</div>
  <div class="aud-dark" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px;box-sizing:border-box;padding:var(--aha-space-16);background:var(--aha-bg-dark);border-radius:var(--aha-radius-lg)">
    <aha-progress palette="deck" percent="60"></aha-progress>
    <aha-progress palette="deck" steps="5" percent="60"></aha-progress>
    <aha-progress palette="deck" type="circle" size="small" percent="45"></aha-progress>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-progress.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Type / Status / Percent) is
     generated from contracts/progress.json → playground and drives the [data-probe] element live. -->
<script type="module">
  import '../lib/icons.js';         // registers <aha-icon> so the status ✓/✕ glyph resolves from the DS library
  import '../lib/aha-progress.js';  // registers <aha-progress> — the shipped primitive, byte-identical to consumers'
  import { applyDeck } from '../lib/audience-deck.js';
  for (const deck of document.querySelectorAll('.aud-dark')) applyDeck(deck, { textColour: '#FFFFFF', presentationColorPalette: ['#E70E68'] });
</script>
