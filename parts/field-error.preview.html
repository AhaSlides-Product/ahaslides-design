<div class="pad">
  <div class="lbl">Form variant (a11y FieldError) — &lt;aha-input status="error"&gt; sets aria-invalid and forwards aria-describedby to its field</div>
  <div style="display:flex; flex-direction:column; gap:4px; max-width:360px">
    <span style="font-size:14px; line-height:22px; font-weight:600; color:var(--aha-text-default)">Email</span>
    <aha-input id="fe-email" status="error" value="name@" aria-describedby="fe-email-error"></aha-input>
    <aha-field-error data-probe id="fe-email-error" message="Enter an email address, like name@example.com"></aha-field-error>
  </div>
  <div class="lbl" style="margin-top:24px">Empty message — renders nothing (the node stays for aria-describedby)</div>
  <div style="display:flex; flex-direction:column; gap:4px; max-width:360px">
    <aha-input id="fe-name" value="Ada" aria-describedby="fe-name-error"></aha-input>
    <aha-field-error data-empty id="fe-name-error"></aha-field-error>
  </div>
  <div class="lbl" style="margin-top:24px">Respondent variant (FieldErrorDisplay) — role=alert, aria-live=assertive</div>
  <div style="max-width:360px">
    <aha-field-error id="fe-q3-error" variant="respondent" message="Pick at least one option"></aha-field-error>
  </div>
</div>

<!-- Imports the REAL shipped elements — no inlined copy, so the preview can never drift from lib/. -->
<script type="module">
  import '../lib/aha-input.js';
  import '../lib/aha-field-error.js';
</script>
