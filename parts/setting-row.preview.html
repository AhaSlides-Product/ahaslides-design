<div class="pad">
  <div class="lbl">Try it with the controls</div>
  <div class="demo-stage">
    <aha-setting-row data-probe label="Leaderboard" help="Shown to the audience between slides.">
      <aha-switch slot="control" checked></aha-switch>
    </aha-setting-row>
  </div>

  <div class="lbl">Inline</div>
  <div class="stack">
    <aha-setting-row label="Progress bar"><aha-switch slot="control" checked></aha-switch></aha-setting-row>
    <aha-setting-row label="Leaderboard" help="Shown to the audience between slides."><aha-switch slot="control"></aha-switch></aha-setting-row>
    <aha-setting-row label="Show correct answers"><aha-checkbox slot="control"></aha-checkbox></aha-setting-row>
    <aha-setting-row label="Question timer" disabled><aha-switch slot="control" disabled></aha-switch></aha-setting-row>
  </div>

  <div class="lbl">Locked (plan-gated)</div>
  <div class="stack">
    <aha-setting-row label="Custom branding" help="Your logo on every deck." locked upgrade-body="Add your logo and colours to every deck."><aha-switch slot="control"></aha-switch></aha-setting-row>
    <aha-setting-row label="Brand theme" locked layout="stack" upgrade-body="Apply a saved brand theme in one click."><aha-select slot="control" value="a" options='[{"label":"Aha default","value":"a"},{"label":"Brand","value":"b"}]'></aha-select></aha-setting-row>
  </div>

  <div class="lbl">Locked, in a right-hand panel</div>
  <div style="display:flex;justify-content:flex-end;height:320px;background:var(--aha-bg-layout);border:1px solid var(--aha-border);border-radius:var(--aha-radius-lg);overflow:hidden">
    <div style="width:280px;height:100%;overflow:auto;box-sizing:border-box;padding:var(--aha-space-4);background:var(--aha-bg-container);border-left:1px solid var(--aha-border)">
      <aha-setting-row label="Custom branding" help="Your logo on every deck." locked plan="pro" upgrade-body="Add your logo and colours to every deck."><aha-switch slot="control"></aha-switch></aha-setting-row>
    </div>
  </div>

  <div class="lbl">Stacked</div>
  <div class="stack">
    <aha-setting-row label="Deck title" layout="stack"><aha-input slot="control" value="Untitled"></aha-input></aha-setting-row>
    <aha-setting-row label="Speaker notes" help="Notes only you can see." layout="stack"><aha-input slot="control" placeholder="Add a note"></aha-input></aha-setting-row>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-setting-row.js) — no inlined copy, so the preview
     can never drift from lib/. The playground control bar (Layout / Help / Disabled) is generated
     from contracts/setting-row.json → playground and drives the [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/icons.js';             // registers <aha-icon> so the "?" help glyph resolves from the DS library
  import '../lib/aha-setting-row.js';   // registers <aha-setting-row> — the shipped primitive, byte-identical to what consumers get
  import '../lib/aha-switch.js';        // registers <aha-switch> (a control it carries)
  import '../lib/aha-checkbox.js';      // registers <aha-checkbox> (a control it carries)
  import '../lib/aha-select.js';        // registers <aha-select> (a locked stacked row)
  import '../lib/aha-input.js';         // registers <aha-input> (a wide control for the stack layout)
</script>
