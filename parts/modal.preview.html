<!-- ONE UI (React · antd v6), themed to DS V3 via the shared modalTheme. Vue consumes the same
     modalTheme — see "Show code". This CDN-React page (no build step) is also what qa.mjs measures.
     The DS has TWO modal types, each TRIGGERED by a button (click → open), matching real use:
       • Confirmation modal — Default / Confirm / Warning / Info / Danger (status icon + copy +
         Learn-more link + Cancel/Apply). Always `simple` size (504 · 35vw · 75vh).
       • Action modal — Simple 504·35vw·75vh · Complexity 720·50vw·80vh · Rich 1280·90vw·90vh,
         with an optional header/footer divider. Body scrolls once content passes the height cap.
     Every variant opens as a REAL overlay: it portals to <body>, an always-on mask covers the whole
     viewport, page scroll is locked while it's open, and clicking the mask (or Esc / the ✕) closes it.
     Nothing is scoped to the preview — this is exactly the runtime behaviour, so a big modal is never
     clipped. Conformance opens the Simple variant via its trigger, then measures it. -->
<style>
  /* outline:none suppresses the DS global :focus-visible ring on the modal POSITIONER (a
     non-interactive div antd focuses on open); interactive children keep their focus rings. */
  .ant-modal { outline: none; }
</style>

<!-- Register <aha-icon> so the Confirmation status glyphs (check/warning/info/x-circle) resolve
     from the DS library — same import every leaf preview uses. -->
<script type="module">import '../lib/icons.js';</script>

<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__modal = {
  theme: {
    token: { colorPrimary:'#6A1EBB', borderRadius:8, colorText:'#1A1A1A', colorBgElevated:'#FFFFFF',
             fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif' },
    components:{ Modal:{ contentBg:'#FFFFFF', headerBg:'#FFFFFF', titleColor:'#1A1A1A', titleFontSize:18, borderRadiusLG:8 } }
  }
};
</script>

<script type="text/babel">
const { ConfigProvider, Modal, Button } = window.__antdR;
const { useState } = React;

// DS V3 size policy — three tiers (Action-modal use cases; a Confirmation modal uses `simple`), each
// a target px width capped to a fraction of the viewport so a modal never grows bigger than the
// screen. WIDTH via the `width` prop (min(px, vw), centred); HEIGHT via styles + body scroll. These
// mirror the shipped modalWidth() / modalStyles() from @ahaslides-product/design (real vw/vh — the
// modal is a real full-viewport overlay, so a large one is capped + scrolls, never clipped).
const MAX_W = { simple: '35vw', complexity: '50vw', rich: '90vw' };
const MAX_H = { simple: '75vh', complexity: '80vh', rich: '90vh' };
const TARGET_W = { simple: 504, complexity: 720, rich: 1280 };
const modalWidth = (size = 'simple') => `min(${TARGET_W[size]}px, ${MAX_W[size]})`;
const modalStyles = (size = 'simple') => ({
  // `container` = the antd v6 dialog box (.ant-modal-container), NOT `content` (dead key in v6).
  container: { display: 'flex', flexDirection: 'column', maxHeight: MAX_H[size] },
  body: { flex: '1 1 auto', minHeight: 0, overflowY: 'auto' },
});

// Confirmation contexts → status glyph (shared <aha-icon> by name) + semantic colour token.
const CTX = {
  default: null,
  confirm: { icon: 'system-check-circle',   color: 'var(--aha-color-success)' },
  warning: { icon: 'system-warning-circle', color: 'var(--aha-color-warning)' },
  info:    { icon: 'system-info',           color: 'var(--aha-color-info)' },
  danger:  { icon: 'system-x-circle',       color: 'var(--aha-color-error)' },
};
const cap = (s) => s[0].toUpperCase() + s.slice(1);

// External = an absolute URL whose host isn't ahaslides.com. A relative or *.ahaslides.com link
// stays in-product. (Guards `new URL` behind the protocol test so a relative href never throws.)
const isExternalUrl = (href) =>
  /^https?:\/\//i.test(href) && !/(^|\.)ahaslides\.com$/i.test(new URL(href).hostname);

// The DS footer: a "Learn more" link on the left, Cancel + Apply on the right (Apply is primary;
// danger tints it for the Danger confirmation).
function Footer({ danger, onCancel, learnMoreHref = 'https://example.com/reuse-themes' }) {
  const external = isExternalUrl(learnMoreHref);
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%' }}>
      {/* "Learn more" is NAVIGATION → a DS link (--aha-text-link, weight 400), not a Button. The
          shared <aha-icon> external-link glyph shows ONLY when the target leaves AhaSlides (and such
          links open in a new tab); an internal or relative link omits it. */}
      <a href={learnMoreHref} target={external ? '_blank' : undefined} rel={external ? 'noreferrer' : undefined}
         style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: 'var(--aha-text-link)', textDecoration: 'none' }}>
        Learn more
        {external && <aha-icon name="system-arrow-square-out" size="14"></aha-icon>}
      </a>
      <span style={{ display: 'inline-flex', gap: 8 }}>
        <Button onClick={onCancel}>Cancel</Button>
        <Button type="primary" danger={danger}>Apply</Button>
      </span>
    </div>
  );
}

// Placeholder body — height grows with the size so the bigger tiers overflow the height cap and the
// body scrolls (title + footer stay pinned), demonstrating the scroll behaviour in the real overlay.
const BODY_H = { simple: 96, complexity: 480, rich: 980 };
function ActionBody({ size }) {
  return (
    <div style={{ minHeight: BODY_H[size], display: 'flex', alignItems: 'center', justifyContent: 'center',
                  border: '1px dashed var(--aha-split)', borderRadius: 8, color: 'var(--aha-text-secondary)' }}>
      Body
    </div>
  );
}

function Demo() {
  const [open, setOpen] = useState(false);          // starts closed — a button triggers it
  const [kind, setKind] = useState('action');       // 'confirmation' | 'action'
  const [context, setContext] = useState('default');
  const [size, setSize] = useState('simple');
  const [divider, setDivider] = useState(false);

  const isConf = kind === 'confirmation';
  const sizeKey = isConf ? 'simple' : size;
  const ctx = CTX[context];
  const close = () => setOpen(false);

  const openConfirmation = (c) => { setKind('confirmation'); setContext(c); setOpen(true); };
  const openAction = (s) => { setKind('action'); setSize(s); setOpen(true); };

  // A styled title: Confirmation contexts prefix a status icon; Action is a plain heading.
  const title = isConf && ctx
    ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
        <aha-icon name={ctx.icon} size="22" style={{ color: ctx.color }}></aha-icon>
        <span>Modal title</span>
      </span>
    : 'Modal title';

  // Divider variant (Action only): a hairline under the header + above the footer.
  const dividerStyles = (!isConf && divider)
    ? { header: { borderBottom: '1px solid var(--aha-split)', marginBottom: 0, paddingBottom: 12 },
        footer: { borderTop: '1px solid var(--aha-split)', marginTop: 0, paddingTop: 12 } }
    : {};

  const Trigger = ({ onClick, active, children }) => (
    <Button size="small" type={active ? 'primary' : 'default'} onClick={onClick}>{children}</Button>
  );

  return (
    <div style={{ maxWidth: 820 }}>
      {/* Button triggers — click to OPEN each modal, the way it's actually used. */}
      <div className="aha-pg" style={{ borderRadius: 8, border: '1px solid var(--aha-split)' }}>
        <div className="aha-pg-row">
          <span className="aha-pg-label">Confirmation</span>
          <span style={{ display: 'inline-flex', gap: 8, flexWrap: 'wrap' }}>
            {Object.keys(CTX).map((c) => (
              <Trigger key={c} active={open && isConf && context === c} onClick={() => openConfirmation(c)}>{cap(c)}</Trigger>
            ))}
          </span>
        </div>
        <div className="aha-pg-row">
          <span className="aha-pg-label">Action</span>
          <span style={{ display: 'inline-flex', gap: 8, flexWrap: 'wrap' }}>
            {['simple', 'complexity', 'rich'].map((s) => (
              <Trigger key={s} active={open && !isConf && size === s} onClick={() => openAction(s)}>{cap(s)}</Trigger>
            ))}
            <Trigger active={divider} onClick={() => setDivider((v) => !v)}>Divider {divider ? 'on' : 'off'}</Trigger>
          </span>
        </div>
      </div>

      <p className="lbl" style={{ marginTop: 14, color: 'var(--aha-text-secondary)' }}>
        Pick a type — the modal opens as a real full-viewport overlay (masked, page scroll locked).
        Click the dimmed area, press Esc, or the ✕ to close.
      </p>

      {/* Real overlay: no getContainer → portals to <body>; mask + scroll-lock are antd defaults;
          maskClosable closes on a mask click. DEFAULT variant (Action · Simple) is the conformance
          target — opened by its trigger during measurement. */}
      <Modal
        open={open}
        onCancel={close}
        title={title}
        width={modalWidth(sizeKey)}
        styles={{ ...modalStyles(sizeKey), ...dividerStyles }}
        footer={<Footer danger={context === 'danger'} onCancel={close} />}
        centered
        maskClosable
        destroyOnHidden
      >
        {isConf
          ? <p style={{ margin: '8px 0 0', color: 'var(--aha-text-secondary)' }}>
              Create a team to share and reuse this theme with others.
            </p>
          : <ActionBody size={size} />}
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('react-root')).render(
  <ConfigProvider theme={window.__modal.theme}><Demo /></ConfigProvider>
);
</script>
