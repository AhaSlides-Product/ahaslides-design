<!-- ONE UI (React · antd v6), themed through the shared base theme (tooltipTheme). Vue consumes the same
     theme (see "Show code"). This CDN-React page is also what qa.mjs measures: the real antd Tooltip. -->
<div id="react-root" class="pad"></div>

<script type="module">import '../lib/aha-button.js';</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { ConfigProvider, Tooltip } = window.__antdR;

function Demo() {
  return (
    <ConfigProvider theme={window.__ahaDsTheme()}>
      <div style={{ padding: '72px 0 24px', display: 'flex', gap: 96, justifyContent: 'center' }}>
          <Tooltip title="Rename lesson" open><aha-button variant="secondary" size="md">Rename</aha-button></Tooltip>
          <Tooltip title="New" open color={window.__ahaDsTheme().token.colorPrimary}><aha-button variant="secondary" size="md">Brand fill</aha-button></Tooltip>
        </div>
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById('react-root')).render(<Demo />);
</script>
