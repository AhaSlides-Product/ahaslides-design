<div class="pad">
  <div class="lbl">Click to open</div>
  <div class="row" style="align-items:flex-start; min-height:320px">
    <aha-dropdown data-probe label="Actions"
      items='[
        {"key":"rename","label":"Rename","icon":"system-pencil-simple"},
        {"key":"duplicate","label":"Duplicate","icon":"system-copy"},
        {"key":"export","label":"Export","icon":"system-export","children":[
          {"key":"pdf","label":"PDF","icon":"system-file"},
          {"key":"pptx","label":"PowerPoint","icon":"system-file"},
          {"key":"xlsx","label":"Excel","icon":"system-file"}
        ]},
        {"key":"disabled","label":"Archive","icon":"system-export","disabled":true},
        {"type":"divider"},
        {"key":"delete","label":"Delete","icon":"system-trash","danger":true}
      ]'>
    </aha-dropdown>
    <aha-dropdown label="Move to" placement="bottomRight"
      items='[
        {"key":"team","label":"Team space","icon":"system-folder","children":[
          {"key":"marketing","label":"Marketing"},
          {"key":"sales","label":"Sales"},
          {"key":"eng","label":"Engineering"}
        ]},
        {"key":"private","label":"Private","icon":"system-folder"}
      ]'>
    </aha-dropdown>
    <aha-dropdown label="Add slide"
      items='[{"key":"poll","label":"Poll","icon":"system-chart-bar"},{"key":"quiz","label":"Quiz","icon":"system-question"},{"key":"wordcloud","label":"Word cloud","icon":"system-chart-donut"}]'>
    </aha-dropdown>
    <aha-dropdown label="Share as"
      items='[
        {"key":"editor","label":"Editor","description":"Edit and present"},
        {"key":"presenter","label":"Presenter","description":"Present only, cannot edit"}
      ]'>
    </aha-dropdown>
    <aha-dropdown placement="bottomRight"
      items='[{"key":"rename","label":"Rename","icon":"system-pencil-simple"},{"key":"duplicate","label":"Duplicate","icon":"system-copy"},{"type":"divider"},{"key":"delete","label":"Delete","icon":"system-trash","danger":true}]'>
      <aha-button slot="trigger" variant="secondary" icon-only aria-label="More actions"><aha-icon slot="icon" name="system-dots-three-vertical" size="16" decorative></aha-icon></aha-button>
    </aha-dropdown>
    <aha-dropdown value="editor"
      items='[
        {"key":"editor","label":"Editor","description":"Edit and present"},
        {"key":"presenter","label":"Presenter","description":"Present only, cannot edit"}
      ]'>
    </aha-dropdown>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-dropdown.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Placement / Content) is
     generated from contracts/dropdown.json → playground and drives this element's attributes live. -->
<div class="pad">
  <div class="lbl">Loading: the spinner replaces the caret and the menu cannot open</div>
  <div class="row">
    <aha-dropdown loading label="Saving"
      items='[{"key":"retry","label":"Retry","testid":"retry-row"},{"key":"cancel","label":"Cancel"}]'>
    </aha-dropdown>
  </div>
</div>
<div class="pad">
  <div class="lbl">Locked rows: a plan-gated row keeps its look, shows the Paywall crown and opens the Paywall beside it</div>
  <div class="row" style="align-items:flex-start; min-height:300px">
    <aha-dropdown label="Export"
      items='[
        {"key":"png","label":"Image","icon":"system-file-image"},
        {"key":"pdf","label":"PDF","icon":"system-file-pdf","locked":true,"featureKey":"export_pdf","upgradeBody":"Export your responses as a PDF report."},
        {"key":"xlsx","label":"Excel","icon":"system-file-xls","locked":true,"plan":"essential","featureKey":"export_excel","upgradeBody":"Export raw responses to Excel."},
        {"type":"divider"},
        {"key":"delete","label":"Delete","icon":"system-trash","danger":true}
      ]'>
    </aha-dropdown>
  </div>
</div>
<div class="pad">
  <div class="lbl">Context menu with shortcuts: the key as the DS chip at the trailing edge, before a locked row's crown</div>
  <div class="row" style="align-items:flex-start">
    <aha-dropdown label="Slide"
      items='[
        {"key":"new","label":"New slide","icon":"system-plus"},
        {"key":"duplicate","label":"Duplicate","icon":"system-duplicate","shortcut":"Mod+D"},
        {"key":"copy","label":"Copy to…","icon":"system-copy"},
        {"key":"skip","label":"Skip slide","icon":"system-eye-slash","locked":true,"featureKey":"skip_slide"},
        {"type":"divider"},
        {"key":"delete","label":"Delete","icon":"system-trash","danger":true,"shortcut":"Del"}
      ]'>
    </aha-dropdown>
  </div>
</div>
<script type="module">
  import '../lib/icons.js';         // registers <aha-icon> so the caret + leading glyphs resolve from the DS library
  import '../lib/aha-button.js';    // the kebab trigger is an icon-only aha-button
  import '../lib/aha-dropdown.js';  // registers <aha-dropdown> — the shipped primitive, byte-identical to what consumers get
  // Open the probe panel so the preview shows the revealed state (rotated caret, danger row) AND open its
  // submenu flyout, so the conformance measure can read the flyout panel + the submenu-parent's aria/caret.
  customElements.whenDefined('aha-dropdown').then(() => requestAnimationFrame(() => {
    const d = document.querySelector('aha-dropdown[data-probe]');
    if (d && d._setOpen) {
      d._setOpen(true);
      const parent = d.shadowRoot && d.shadowRoot.querySelector('.item.parent');
      if (parent && d._openFlyout) d._openFlyout(parent);
    }
  }));
</script>
