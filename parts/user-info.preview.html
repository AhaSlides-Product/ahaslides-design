<!-- Imports the REAL shipped element (../lib/aha-user-info.js) + the icon library — no inlined copy,
     so the preview can never drift from lib/. aha-user-info reuses the shipped <aha-avatar>. The
     playground control bar (Size / Email) is generated from contracts/user-info.json → playground
     and drives this [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/icons.js';           // registers <aha-icon> so the avatar glyph fallback resolves
  import '../lib/aha-user-info.js';   // registers <aha-user-info> (+ <aha-avatar>) — the shipped primitives
</script>
