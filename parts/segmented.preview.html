<div class="pad">
  <div class="lbl">Segmented · leading icons · a disabled option · size medium (default)</div>
  <aha-segmented data-probe value="week"
    options='[
      {"value":"day","label":"Day","icon":"system-calendar-dot"},
      {"value":"week","label":"Week","icon":"system-calendar-dots"},
      {"value":"month","label":"Month","icon":"system-table"},
      {"value":"year","label":"Year","disabled":true}
    ]'>
  </aha-segmented>

  <div class="lbl">Interactive · click to switch</div>
  <div class="row"><aha-segmented id="demo" options="Day|Week|Month" value="Week"></aha-segmented> <span id="out" class="note">Week</span></div>

  <div class="lbl">Icon-only (aria-label) · block · whole-control disabled</div>
  <div class="row" style="gap:16px;flex-wrap:wrap;align-items:stretch">
    <aha-segmented options='[{"value":"list","icon":"system-list","ariaLabel":"List view"},{"value":"grid","icon":"system-squares-four","ariaLabel":"Grid view"},{"value":"table","icon":"system-rows","ariaLabel":"Table view"}]' value="grid"></aha-segmented>
    <aha-segmented options="On|Off" value="On" disabled></aha-segmented>
  </div>
  <div class="row" style="display:block"><aha-segmented block options="Overview|Responses|Settings" value="Responses"></aha-segmented></div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-segmented.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Size / Content / Block) is
     generated from contracts/segmented.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';           // registers <aha-icon> so leading/icon-only glyphs resolve from the DS library
  import '../lib/aha-segmented.js';   // registers <aha-segmented> — the shipped primitive, byte-identical to consumers'
  customElements.whenDefined('aha-segmented').then(() => {
    const demo = document.getElementById('demo'), out = document.getElementById('out');
    if (demo && out) demo.addEventListener('change', (e) => { out.textContent = e.detail.value; });
  });
</script>
