<!-- ONE UI (React · antd v6), themed to DS V3 via the shared timePickerTheme. Vue consumes the same
     timePickerTheme — see "Show code". This CDN-React page (no build step) is also what qa.mjs
     measures: the real antd TimePicker field bound to the shared theme. Times use Day.js. -->
<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/dayjs@1/plugin/customParseFormat.js"></script>
<script>dayjs.extend(window.dayjs_plugin_customParseFormat);</script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__tp = {
  token: { colorPrimary:'#6A1EBB', borderRadius:8, controlHeight:32, colorBorder:'#E3E3E3',
           colorTextPlaceholder:'#8A8A8A', fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif' },
  components:{ DatePicker:{ borderRadius:8, controlHeight:32, cellHoverBg:'#F7F7F7', cellActiveWithRangeBg:'#F9F5FF' } }
};
</script>

<script type="text/babel">
const { ConfigProvider, TimePicker } = window.__antdR;
function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div className="lbl" style={{ marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('react-root')).render(
  <ConfigProvider theme={window.__tp}>
    <div>
      <Field label="24-hour · HH:mm">
        <TimePicker defaultValue={dayjs('09:30', 'HH:mm')} format="HH:mm" style={{ width: 200 }} />
      </Field>
      <Field label="12-hour · 15-min step">
        <TimePicker use12Hours format="h:mm a" minuteStep={15} placeholder="Pick a time" style={{ width: 200 }} />
      </Field>
    </div>
  </ConfigProvider>
);
</script>
