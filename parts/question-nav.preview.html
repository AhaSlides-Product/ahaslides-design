<div class="pad">
  <div class="lbl">Current question (no results)</div>
  <div class="demo-stage">
    <aha-question-nav data-probe count="12" current="3" results="correct||||||||||"></aha-question-nav>
  </div>

  <div class="lbl">With an answer mark per question</div>
  <div class="demo-stage">
    <aha-question-nav count="8" current="2" results="correct|incorrect||correct|incorrect|correct|correct|incorrect"></aha-question-nav>
  </div>

  <div class="lbl">Overflow: scrolls, with scroll buttons (60 questions, 280px wide)</div>
  <div class="demo-stage">
    <aha-question-nav style="max-width:280px" count="60" current="24"></aha-question-nav>
  </div>

  <div class="lbl">Wrap</div>
  <div class="demo-stage">
    <aha-question-nav wrap style="max-width:280px" count="30" current="7"></aha-question-nav>
  </div>

  <div class="lbl">Picked question</div>
  <div class="demo-stage">
    <aha-question-nav id="live" count="10" current="1"></aha-question-nav>
    <p id="liveOut" style="margin:12px 0 0">Question 1</p>
  </div>
</div>

<script type="module">
  import '../lib/icons.js';
  import '../lib/aha-answer-mark.js';
  import '../lib/aha-question-nav.js';
  document.getElementById('live').addEventListener('change', (event) => {
    document.getElementById('liveOut').textContent = 'Question ' + event.detail.value;
  });
</script>
