<div class="pad">
  <div class="lbl">Count · over a wrapped child · capped as N+ · custom colour</div>
  <div class="row" style="gap:24px; align-items:center">
    <aha-badge data-probe count="5"></aha-badge>
    <aha-badge count="128" overflow-count="99"></aha-badge>
    <aha-badge count="0" show-zero></aha-badge>
    <aha-badge count="9" color="#722ED1"></aha-badge>
    <aha-badge count="12"><button style="padding:8px 14px; border:1px solid var(--aha-border,#E3E3E3); border-radius:var(--aha-radius-default,8px); background:#fff; font:inherit; cursor:pointer">Inbox</button></aha-badge>
    <aha-badge dot><aha-icon name="system-bell" size="24"></aha-icon></aha-badge>
  </div>
  <div class="lbl">Dot · a bare marker in each status colour</div>
  <div class="row" style="gap:16px; align-items:center">
    <aha-badge dot status="error"></aha-badge>
    <aha-badge dot status="success"></aha-badge>
    <aha-badge dot status="warning"></aha-badge>
    <aha-badge dot status="processing"></aha-badge>
  </div>
  <div class="lbl">Status · a standalone semantic dot + label</div>
  <div class="row" style="gap:20px; align-items:center; flex-wrap:wrap">
    <aha-badge status="success" text="Published"></aha-badge>
    <aha-badge status="processing" text="Generating"></aha-badge>
    <aha-badge status="error" text="Failed"></aha-badge>
    <aha-badge status="warning" text="Draft"></aha-badge>
    <aha-badge status="default" text="Archived"></aha-badge>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-badge.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Type / Status) is generated
     from contracts/badge.json → playground and drives the [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so the wrapped bell glyph resolves from the DS library
  import '../lib/aha-badge.js';   // registers <aha-badge> — the shipped primitive, byte-identical to what consumers get
</script>
