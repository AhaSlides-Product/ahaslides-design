<div class="pad">
  <div class="lbl">Try it with the controls</div>
  <div class="demo-stage">
    <aha-stepper data-probe steps="Ideas|Group|Vote|Discuss" current="1" aria-label="Retro stages"></aha-stepper>
  </div>

  <div class="lbl">States</div>
  <div style="display:grid; gap:16px">
    <aha-stepper steps="Ideas|Group|Vote|Discuss" current="0"></aha-stepper>
    <aha-stepper steps="Ideas|Group|Vote|Discuss" current="2"></aha-stepper>
    <aha-stepper steps="Ideas|Group|Vote|Discuss" current="3"></aha-stepper>
  </div>

  <div class="lbl">Large, on the canvas</div>
  <div class="row" style="align-items:center; gap:24px; flex-wrap:wrap">
    <aha-stepper size="lg" steps="Ideas|Group|Vote|Discuss" current="1" style="flex:1 1 320px"></aha-stepper>
    <aha-button size="lg" variant="primary" shortcut="Enter">Next</aha-button>
  </div>

  <div class="lbl">On a dark deck</div>
  <div style="background:var(--aha-gray-100,#1A1A1A); padding:24px; border-radius:var(--aha-radius-lg,12px)">
    <aha-stepper size="lg" steps="Ideas|Group|Vote|Discuss" current="2" style="color:var(--aha-white,#FFFFFF)"></aha-stepper>
  </div>

  <div class="lbl">On the canvas, inked by applyCanvasDeck (black ink · white ink)</div>
  <div style="display:grid; gap:16px">
    <div data-stepper-deck data-ink="#1A1A1A" style="background:var(--aha-white,#FFFFFF) url(../backgrounds/splash-centre-white-16x9.svg) center / cover; padding:24px; border-radius:var(--aha-radius-lg,12px)">
      <aha-stepper size="lg" navigable steps="Ideas|Group|Vote|Discuss" current="2"></aha-stepper>
    </div>
    <div data-stepper-deck data-ink="#FFFFFF" style="background:var(--aha-vivid-pink-100,#E70E68) url(../backgrounds/splash-centre-pink-16x9.svg) center / cover; padding:24px; border-radius:var(--aha-radius-lg,12px)">
      <aha-stepper size="lg" navigable steps="Ideas|Group|Vote|Discuss" current="2"></aha-stepper>
    </div>
  </div>

  <div class="lbl">Navigable</div>
  <aha-stepper navigable steps="Details|Questions|Review" current="1"></aha-stepper>
</div>

<script type="module">
  import '../lib/icons.js';
  import '../lib/aha-stepper.js';
  import '../lib/aha-button.js';
  import { applyCanvasDeck } from '../lib/canvas-deck.js';
  for (const deck of document.querySelectorAll('[data-stepper-deck]')) applyCanvasDeck(deck, { ink: deck.dataset.ink, image: true });
</script>
