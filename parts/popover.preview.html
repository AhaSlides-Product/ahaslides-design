<div class="pad" style="min-height:240px">
  <div class="lbl">Popover · title + content · placement · trigger · arrow · click the trigger</div>
  <div class="row" style="gap:32px;align-items:flex-start">
    <aha-popover placement="bottom" trigger="click" arrow title="Share this deck">
      <button slot="trigger" class="pv-btn">Options</button>
      <div>
        <p style="margin:0 0 8px">Share, rename or export this deck.</p>
        <a href="#">Manage access</a>
      </div>
    </aha-popover>

    <aha-popover data-probe open placement="bottom" arrow
      title="Share this deck"
      content="Anchored floating content — richer than a tooltip, with a bold title.">
      <button slot="trigger" class="pv-btn">Open (probe)</button>
    </aha-popover>

    <aha-popover placement="bottom-end" trigger="click" arrow title="Edge-aligned"
      content="bottom-end — pinned to the trigger's right edge, arrow near it.">
      <button slot="trigger" class="pv-btn">Bottom · end</button>
    </aha-popover>
  </div>
</div>

<style>
  .pv-btn{ font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif); font-size:14px; font-weight:600;
    padding:6px 14px; border:1px solid var(--aha-border,#E3E3E3); border-radius:var(--aha-radius-sm,6px);
    background:var(--aha-bg-container,#FFFFFF); color:var(--aha-text-default,#1A1A1A); cursor:pointer }
</style>

<!-- Imports the REAL shipped element (../lib/aha-popover.js) — no inlined copy, so the preview can
     never drift from lib/. The playground control bar (Placement / Trigger) is generated from
     contracts/popover.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/aha-popover.js';   // registers <aha-popover> — the shipped primitive, byte-identical to consumers'
</script>
