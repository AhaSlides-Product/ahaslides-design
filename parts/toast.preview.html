<!-- ONE UI (React · antd v6), themed to DS V3 via the shared toastTheme. Vue consumes the same
     toastTheme — see "Show code". This CDN-React page (no build step) is also what qa.mjs
     measures: a sticky toast (duration 0) is opened on mount so the real antd message notice,
     bound to the shared theme, can be measured. The buttons fire fresh toasts. -->
<style>
  #react-root .aha-demo { max-width:420px; font-family:var(--aha-font-product); }
  #react-root .aha-demo .lbl { margin-bottom:10px; color:var(--aha-text-secondary); }
</style>

<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script type="module">
  import { dismissibleToast } from '../lib/toast-theme.js';   // registers <aha-close-button> — the shipped ✕
  window.__dismissibleToast = dismissibleToast;
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__toast = {
  theme: {
    token: { colorPrimary:'#E70E68', borderRadius:8, colorText:'#1A1A1A', colorBgElevated:'#FFFFFF',
             fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif' },
    components:{ Message:{ contentBg:'#FFFFFF', contentPadding:'9px 12px' } }
  }
};
</script>

<script type="text/babel">
const { ConfigProvider, message, Button } = window.__antdR;
const { useState, useEffect } = React;

// The DS-mandated message pattern: the useMessage() hook + contextHolder inside <ConfigProvider>.
// The static message.success() is forbidden — it renders outside the provider and drops the theme.
const CONTENT = {
  success: 'Slide saved',
  info:    'Link copied to clipboard',
  warning: 'You are near the slide limit',
  error:   'Upload failed',
  loading: 'Saving your changes…',
};

// A segmented control that mirrors the leaf smart-widget bar (.aha-pg styles from the doc shell),
// but wired to React state so an antd composite gets the same explorable playground.
function Seg({ label, value, onChange, options }) {
  return (
    <div className="aha-pg-row">
      <span className="aha-pg-label">{label}</span>
      <div className="aha-pg-seg" role="radiogroup" aria-label={label}>
        {options.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}
            className={'aha-pg-opt' + (o.value === value ? ' active' : '')}
            onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function Demo() {
  const [api, ctx] = message.useMessage();
  const [type, setType] = useState('success');
  // sticky toast on mount so qa can measure the real rendered notice (default: success)
  // it is sticky, so it carries the shared ✕ (dismissibleToast) 
  const sticky = () => api.open({ key: 'sticky', type: 'success', duration: 0,
    content: window.__dismissibleToast(React.createElement, CONTENT.success, () => api.destroy('sticky')) });
  useEffect(() => { sticky(); }, []);
  const show = () => (type === 'loading'
    ? api.loading(CONTENT.loading)
    : api[type](CONTENT[type]));
  return (
    <div className="aha-demo">
      {ctx}
      {/* .aha-pg without data-pg → styled like the leaf widget bar, but driven by React, not PLAYGROUND_JS */}
      <div className="aha-pg" style={{ marginBottom: 18, borderRadius: 8 }}>
        <Seg label="Type" value={type} onChange={setType}
          options={[
            { label: 'Success', value: 'success' },
            { label: 'Info', value: 'info' },
            { label: 'Warning', value: 'warning' },
            { label: 'Error', value: 'error' },
            { label: 'Loading', value: 'loading' },
          ]} />
      </div>
      <div className="lbl">Fire a toast</div>
      <Button type="primary" onClick={show} style={{ marginRight: 8 }}>Show toast</Button>
      <Button onClick={sticky}>Sticky with close</Button>
    </div>
  );
}

function App() {
  return (
    <ConfigProvider theme={window.__toast.theme}>
      <Demo />
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById('react-root')).render(<App />);
</script>
