<div class="pad">
  <div class="lbl">Light deck</div>
  <div class="row" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;box-sizing:border-box">
    <aha-instruction-line data-probe>Swipe a card, or tap a side</aha-instruction-line>
  </div>
  <div class="lbl">Dark deck — applyDeck() with a white ink and a Vivid Pink accent</div>
  <div class="row aud-dark" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;box-sizing:border-box;padding:var(--aha-space-16);background:var(--aha-bg-dark);border-radius:var(--aha-radius-lg)">
    <aha-instruction-line>Swipe a card, or tap a side</aha-instruction-line>
  </div>
</div>

<!-- Imports the REAL shipped element, so the preview can never drift from lib/ and qa measures what consumers get. -->
<script type="module">
  import '../lib/aha-instruction-line.js';   // registers <aha-instruction-line>
  import { applyDeck } from '../lib/audience-deck.js';
  for (const deck of document.querySelectorAll('.aud-dark')) applyDeck(deck, { textColour: '#FFFFFF', presentationColorPalette: ['#E70E68'] });
</script>
