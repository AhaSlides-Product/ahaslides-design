<!-- Imports the REAL shipped element (../lib/aha-image.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Preview / Content) is generated
     from contracts/image.json → playground and drives this element's attributes live (preview toggle,
     a broken-src fallback, radius). The close ✕ + broken glyph resolve from the shared <aha-icon>. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so the close ✕ + broken glyph resolve from the DS library
  import '../lib/aha-image.js';   // registers <aha-image> — the shipped primitive, byte-identical to what consumers get
</script>
