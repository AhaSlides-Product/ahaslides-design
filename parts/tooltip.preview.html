<div class="pad" style="padding:64px 20px 40px">
  <div class="lbl">Hover or focus a trigger · placements + a brand fill · the data-probe one is forced open for the scorecard</div>
  <div class="row" style="gap:48px; flex-wrap:wrap; align-items:center">
    <aha-tooltip data-probe open text="Copy share link" placement="top">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Top</button>
    </aha-tooltip>
    <aha-tooltip text="Duplicate this slide" placement="bottom">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Bottom</button>
    </aha-tooltip>
    <aha-tooltip text="Move left" placement="left">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Left</button>
    </aha-tooltip>
    <aha-tooltip text="Move right" placement="right" color="brand">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Right · brand</button>
    </aha-tooltip>
    <!-- built-in `?` help trigger — no slotted trigger needed; the DS <aha-icon> ? renders itself.
         data-probe-help + open so the scorecard can measure the 16px muted icon + aria wiring. -->
    <label style="display:inline-flex; align-items:center; gap:6px; font-family:var(--aha-font-product); font-size:14px; color:var(--aha-text-default)">
      Shuffle options
      <aha-tooltip data-probe-help open help text="Randomise the order options appear in for each participant" placement="top"></aha-tooltip>
    </label>
    <aha-tooltip text="Aligned to the left edge, arrow near it" placement="bottom-start">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Bottom · start</button>
    </aha-tooltip>
    <aha-tooltip text="Aligned to the top edge" placement="right-start" color="brand">
      <button style="font-family:var(--aha-font-product); font-size:14px; padding:6px 12px; border:1px solid var(--aha-border); border-radius:8px; background:#fff; cursor:pointer">Right · start</button>
    </aha-tooltip>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-tooltip.js) — no inlined copy, so the preview can
     never drift from lib/. The playground control bar (Placement / Arrow) is generated from
     contracts/tooltip.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/aha-tooltip.js';   // registers <aha-tooltip> — the shipped primitive, byte-identical to consumers
</script>
