<div class="pad">
  <div class="lbl">Horizontal · size middle (the probe — the playground drives its attributes live)</div>
  <aha-space data-probe size="middle" align="center">
    <button>Save</button>
    <button>Cancel</button>
    <button>More</button>
  </aha-space>

  <div class="lbl" style="margin-top:20px">Sizes · small · middle · large</div>
  <div class="stack" style="gap:14px">
    <aha-space size="small"><span class="pill">A</span><span class="pill">B</span><span class="pill">C</span></aha-space>
    <aha-space size="middle"><span class="pill">A</span><span class="pill">B</span><span class="pill">C</span></aha-space>
    <aha-space size="large"><span class="pill">A</span><span class="pill">B</span><span class="pill">C</span></aha-space>
  </div>

  <div class="lbl" style="margin-top:20px">Split · a thin rule between items</div>
  <aha-space size="middle" split>
    <a href="#">Edit</a>
    <a href="#">Duplicate</a>
    <a href="#">Delete</a>
  </aha-space>

  <div class="lbl" style="margin-top:20px">Vertical stack · size small</div>
  <aha-space direction="vertical" size="small">
    <div>Line one</div>
    <div>Line two</div>
    <div>Line three</div>
  </aha-space>
</div>

<!-- Imports the REAL shipped element (../lib/aha-space.js) — no inlined copy, so the preview can never
     drift from lib/. The playground control bar (Direction / Size / Align) is generated from
     contracts/space.json → playground and drives the [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/aha-space.js';   // registers <aha-space> — the shipped primitive, byte-identical to what consumers get
</script>
