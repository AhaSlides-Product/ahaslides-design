<!-- ONE UI (React · antd v6), themed through the shared base theme (segmentedTheme). Vue consumes the same
     theme (see "Show code"). This CDN-React page is also what qa.mjs measures: the real antd Segmented. -->
<div id="react-root" class="pad"></div>

<script type="module">import '../lib/aha-button.js';</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { ConfigProvider, Segmented } = window.__antdR;

function Demo() {
  return (
    <ConfigProvider theme={window.__ahaDsTheme()}>
      <Segmented options={['Desktop', 'Tablet', 'Mobile']} defaultValue="Desktop" />
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById('react-root')).render(<Demo />);
</script>
