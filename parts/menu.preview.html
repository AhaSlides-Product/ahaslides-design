<div class="pad">
  <div class="lbl">App navigation</div>
  <aha-menu mode="inline" value="home"
    items='[
      {"key":"home","label":"Home","icon":"system-house"},
      {"key":"presentations","label":"My Presentations","icon":"system-presentation-chart"},
      {"key":"templates","label":"Template Library","icon":"system-squares-four"},
      {"key":"shared","label":"Shared Presentations","icon":"system-share-network"},
      {"key":"plan","label":"My Plan","icon":"system-plan"},
      {"key":"integrations","label":"Integration Center","icon":"system-link"},
      {"key":"team","label":"Team Management","icon":"system-users"}
    ]'>
  </aha-menu>

  <div class="lbl">Menu features</div>
  <aha-menu data-probe value="polls"
    items='[
      {"type":"group","label":"Workspace","children":[
        {"key":"polls","label":"Polls","icon":"system-chart-bar"},
        {"key":"quizzes","label":"Quizzes","icon":"system-question"}
      ]},
      {"key":"library","label":"Content library","icon":"system-folder","children":[
        {"key":"templates","label":"Templates"},
        {"key":"archived","label":"Archived","disabled":true}
      ]},
      {"type":"divider"},
      {"key":"team","label":"Team members","icon":"system-users"},
      {"key":"delete","label":"Delete workspace","icon":"system-trash","danger":true}
    ]'>
  </aha-menu>

  <div class="lbl">Settings modal side nav (borderless)</div>
  <aha-menu mode="inline" borderless value="general"
    items='[
      {"type":"group","label":"Presentation","children":[
        {"key":"general","label":"General","icon":"system-gear"},
        {"key":"audience","label":"Audience","icon":"system-users"}
      ]},
      {"type":"group","label":"Quiz","children":[
        {"key":"scoring","label":"Scoring","icon":"system-star"},
        {"key":"leaderboard","label":"Leaderboard","icon":"system-chart-bar"}
      ]}
    ]'>
  </aha-menu>

  <div class="lbl">Role picker (item description)</div>
  <aha-menu value="editor"
    items='[
      {"key":"editor","label":"Editor","description":"Edit and present"},
      {"key":"presenter","label":"Presenter","description":"Present only, cannot edit"},
      {"type":"divider"},
      {"key":"remove","label":"Remove access","description":"They lose access to this presentation","icon":"system-trash","danger":true}
    ]'>
  </aha-menu>

  <div class="lbl">Context menu with shortcuts (the key as the DS chip at the trailing edge)</div>
  <aha-menu
    items='[
      {"key":"new","label":"New slide","icon":"system-plus"},
      {"key":"duplicate","label":"Duplicate","icon":"system-duplicate","shortcut":"Mod+D"},
      {"key":"copy","label":"Copy to…","icon":"system-copy"},
      {"key":"paste","label":"Paste","icon":"system-paste","shortcut":"Mod+V","disabled":true},
      {"type":"divider"},
      {"key":"delete","label":"Delete","icon":"system-trash","danger":true,"shortcut":"Del"}
    ]'>
  </aha-menu>

  <div class="lbl">Overflow menu (rich row, testid, disabled, danger)</div>
  <aha-menu value="rename"
    items='[
      {"key":"rename","label":"Rename","icon":"system-pencil-simple","testid":"menu-rename"},
      {"key":"export","label":"Export to PDF","icon":"system-file-pdf","slot":"export","attrs":{"data-testid":"menu-export"}},
      {"key":"duplicate","label":"Duplicate","icon":"system-copy","disabled":true},
      {"type":"divider"},
      {"key":"delete","label":"Delete","icon":"system-trash","danger":true,"testid":"menu-delete"}
    ]'>
    <span slot="export">Export to PDF <aha-tag color="primary">Pro</aha-tag></span>
  </aha-menu>
</div>

<!-- Imports the REAL shipped element (../lib/aha-menu.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. Two menus: the headline replicates the real AhaSlides main
     nav (Home · My Presentations · Template Library · Shared Presentations · My Plan · Integration
     Center · Team Management) so implementers have a faithful reference; the second (data-probe) is
     the feature showcase (group · submenu · divider · danger · disabled) that qa.mjs measures and the
     playground control bar (Mode / Content, from contracts/menu.json → playground) drives live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so the leading/caret glyphs resolve from the DS library
  import '../lib/aha-menu.js';    // registers <aha-menu> — the shipped primitive, byte-identical to what consumers get
  import '../lib/aha-tag.js';
</script>
