<div class="pad">
  <div class="lbl">Uploader · drop zone + file rows · uploading / done / error states · remove ✕</div>
  <div style="max-width:420px">
    <aha-uploader data-probe accept="image/*" multiple
      items='[
        {"name":"cover-image.png","status":"done"},
        {"name":"slides-export.pdf","status":"uploading","percent":62},
        {"name":"broken-video.mov","status":"error"}
      ]'>
    </aha-uploader>
  </div>
  <div class="note" id="out" style="margin-top:8px">No files selected</div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-uploader.js) + the icon library — no inlined copy,
     so the preview can never drift from lib/. The playground control bar (List type / State) is
     generated from contracts/uploader.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';         // registers <aha-icon> so upload/file/✕/status glyphs resolve from the DS library
  import '../lib/aha-uploader.js';  // registers <aha-uploader> — the shipped primitive, byte-identical to consumers'
  customElements.whenDefined('aha-uploader').then(() => {
    const up = document.querySelector('aha-uploader[data-probe]');
    const out = document.getElementById('out');
    up.addEventListener('change', (e) => { out.textContent = e.detail.files.map((f) => f.name).join(', '); });
    up.addEventListener('remove', (e) => { out.textContent = 'Removed: ' + e.detail.name; });
  });
</script>
