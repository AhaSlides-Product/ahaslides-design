<div class="pad">
  <div class="lbl">Interactive · click or hover to rate</div>
  <div class="row"><aha-rate id="demo" value="3"></aha-rate> <span id="out" class="note">3 / 5</span></div>
  <div class="lbl">States · value 3 (probe) · readonly · disabled</div>
  <div class="row" style="gap:16px">
    <aha-rate data-probe value="3"></aha-rate>
    <aha-rate value="4" readonly></aha-rate>
    <aha-rate value="2" disabled></aha-rate>
  </div>
</div>

<script type="module">
const STYLE = `
  :host{ display:inline-flex }
  .stars{ display:inline-flex; gap:4px; font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif) }
  .star{ display:inline-flex; padding:0; border:0; background:none; cursor:pointer; line-height:0;
    outline:2px solid transparent; outline-offset:2px; border-radius:var(--aha-radius-xs,4px) }
  .star svg{ width:24px; height:24px; fill:var(--aha-gray-40,#E3E3E3);
    transition:fill var(--aha-motion-mid,.2s) var(--aha-ease-in-out,cubic-bezier(0.645,0.045,0.355,1)), transform var(--aha-motion-fast,.1s) var(--aha-ease-out,cubic-bezier(0.215,0.61,0.355,1)) }
  .star.on svg{ fill:var(--aha-yellow-50,#FFE32C) }
  .star:hover svg{ transform:scale(1.12) }
  .star:focus-visible{ outline-color:var(--aha-color-primary,#6A1EBB) }
  :host([readonly]) .star, :host([disabled]) .star{ cursor:default }
  :host([disabled]){ opacity:.4 }
  :host([disabled]) .star:hover svg{ transform:none }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important } }
`;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 5.88 6.49.94-4.7 4.58 1.11 6.46L12 17.9l-5.8 3.05 1.1-6.46-4.69-4.58 6.49-.94z"/></svg>';
class AhaRate extends HTMLElement {
  get max(){ return Math.max(1, parseInt(this.getAttribute('max')||'5',10)); }
  get value(){ return parseFloat(this.getAttribute('value')||'0')||0; }
  set value(v){ this.setAttribute('value', String(v)); this._paint(this.value); }
  get readonly(){ return this.hasAttribute('readonly'); }
  get disabled(){ return this.hasAttribute('disabled'); }
  connectedCallback(){
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    const stars = Array.from({length:this.max},(_,i)=>`<button class="star" type="button" role="radio" aria-label="${i+1} of ${this.max}" data-i="${i+1}">${STAR}</button>`).join('');
    this.shadowRoot.innerHTML = `<style>${STYLE}</style><span class="stars" role="radiogroup">${stars}</span>`;
    this._buttons = Array.from(this.shadowRoot.querySelectorAll('.star'));
    this._paint(this.value);
    if(this.readonly||this.disabled) return;
    this._buttons.forEach((btn)=>{ const n=Number(btn.dataset.i);
      btn.addEventListener('mouseenter',()=>this._paint(n));
      btn.addEventListener('click',()=>{ this.setAttribute('value',String(n)); this._paint(n);
        this.dispatchEvent(new CustomEvent('change',{bubbles:true,composed:true,detail:{value:n}})); }); });
    this.shadowRoot.querySelector('.stars').addEventListener('mouseleave',()=>this._paint(this.value));
  }
  _paint(n){ if(!this._buttons) return; this._buttons.forEach((btn,i)=>btn.classList.toggle('on', i<n)); }
}
customElements.define('aha-rate', AhaRate);
customElements.whenDefined('aha-rate').then(()=>{
  const demo=document.getElementById('demo'), out=document.getElementById('out');
  demo.addEventListener('change',(e)=>{ out.textContent = e.detail.value + ' / 5'; });
});
</script>
