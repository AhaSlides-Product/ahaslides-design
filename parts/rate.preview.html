<div class="pad">
  <div class="lbl">Click or hover to rate</div>
  <div class="row"><aha-rate id="demo" value="3"></aha-rate> <span id="out" class="note">3 / 5</span></div>
  <div class="lbl">States</div>
  <div class="row" style="gap:16px">
    <aha-rate data-probe value="3"></aha-rate>
    <aha-rate value="3.5" allow-half></aha-rate>
    <aha-rate value="4" icon="system-heart-straight"></aha-rate>
    <aha-rate value="4" readonly></aha-rate>
    <aha-rate value="4.5" readonly allow-half></aha-rate>
    <aha-rate value="4.8" size="sm" readonly precision="exact"></aha-rate>
    <aha-rate value="2" disabled></aha-rate>
  </div>
  <div class="lbl">Large (44px tap targets)</div>
  <div class="row" style="gap:16px">
    <aha-rate value="3" size="lg"></aha-rate>
    <aha-rate value="3.5" size="lg" allow-half></aha-rate>
  </div>
  <div class="lbl">Numbers</div>
  <div class="row" style="gap:16px">
    <aha-rate value="7" count="10" character="number"></aha-rate>
    <aha-rate value="3" character="number" size="sm"></aha-rate>
    <aha-rate value="4" count="6" character="number" size="lg"></aha-rate>
  </div>
  <div class="lbl">0 to 10, read-only</div>
  <div class="row" style="gap:16px">
    <aha-rate value="0" count="10" character="number" min="0" readonly></aha-rate>
    <aha-rate value="8" count="10" character="number" min="0" readonly></aha-rate>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-rate.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Half-step / Count / Character /
     Disabled) is generated from contracts/rate.json → playground and drives this element live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so a custom `icon` character resolves from the DS library
  import '../lib/aha-rate.js';    // registers <aha-rate> — the shipped primitive, byte-identical to what consumers get
  customElements.whenDefined('aha-rate').then(() => {
    const demo = document.getElementById('demo'), out = document.getElementById('out');
    demo.addEventListener('change', (e) => { out.textContent = e.detail.value + ' / 5'; });
  });
</script>
