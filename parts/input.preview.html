<div class="pad">
  <div class="lbl">States · error · rest · warning · disabled · readonly</div>
  <div class="row">
    <aha-input data-probe status="error" value="not-an-email" placeholder="Email"></aha-input>
    <aha-input placeholder="Workspace name"></aha-input>
    <aha-input status="warning" value="admin" placeholder="Username"></aha-input>
    <aha-input disabled value="Locked value"></aha-input>
    <aha-input readonly value="read-only@aha.io"></aha-input>
  </div>
  <div class="lbl">Sizes · small 24 · default 32 · large 40</div>
  <div class="row">
    <aha-input size="small" placeholder="Small"></aha-input>
    <aha-input placeholder="Default"></aha-input>
    <aha-input size="large" placeholder="Large"></aha-input>
  </div>
  <div class="lbl">Affixes · prefix icon · suffix text · clearable · password reveal</div>
  <div class="row">
    <aha-input prefix-icon="system-magnifying-glass" type="search" placeholder="Search slides"></aha-input>
    <aha-input prefix-icon="system-envelope" placeholder="you@team.com"></aha-input>
    <aha-input suffix=".ahaslides.com" value="myteam"></aha-input>
    <aha-input clearable value="Clear me" placeholder="Type to clear"></aha-input>
    <aha-input type="password" prefix-icon="system-lock" value="secret123"></aha-input>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-input.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Size / Status / Affix) is
     generated from contracts/input.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so the prefix/clear/reveal glyphs resolve from the DS library
  import '../lib/aha-input.js';   // registers <aha-input> — the shipped primitive, byte-identical to what consumers get
</script>
