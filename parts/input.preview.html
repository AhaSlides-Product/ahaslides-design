<div class="pad">
  <div class="lbl">Label</div>
  <div class="row">
    <aha-input label="Workspace name" placeholder="My team"></aha-input>
    <aha-input size="large" label="Workspace name" placeholder="My team"></aha-input>
    <aha-input disabled label="Workspace name" value="Locked value"></aha-input>
  </div>
  <div class="lbl">States</div>
  <div class="row">
    <aha-input data-probe status="error" error-message="Enter an email address, like name@example.com" value="not-an-email" placeholder="Email"></aha-input>
    <aha-input placeholder="Workspace name"></aha-input>
    <aha-input info-message="Letters and numbers only" value="admin" placeholder="Username"></aha-input>
    <aha-input disabled value="Locked value"></aha-input>
    <aha-input readonly value="read-only@aha.io"></aha-input>
  </div>
  <div class="lbl">Prefix, suffix and clear</div>
  <div class="row">
    <aha-input prefix-icon="system-magnifying-glass" type="search" placeholder="Search slides"></aha-input>
    <aha-input prefix-icon="system-envelope" placeholder="you@team.com"></aha-input>
    <aha-input suffix=".ahaslides.com" value="myteam"></aha-input>
    <aha-input clearable value="Clear me" placeholder="Type to clear"></aha-input>
    <aha-input type="password" prefix-icon="system-lock" value="secret123"></aha-input>
  </div>
  <div class="lbl">Typed text: direction, keyboard and select</div>
  <div class="row">
    <aha-input dir="auto" value="مرحبا بالجميع" placeholder="Your answer"></aha-input>
    <aha-input dir="auto" value="Hello everyone" placeholder="Your answer"></aha-input>
    <aha-input inputmode="decimal" value="1e" placeholder="Amount"></aha-input>
    <aha-input data-select-on-focus prefix="ahaslides.com/s/" value="team-pulse" readonly></aha-input>
  </div>
  <div class="lbl">Prefix that shrinks (a long URL before a slug)</div>
  <div class="row">
    <aha-input prefix-shrink prefix="https://presenter.ahaslides.com/survey/s/" value="team-pulse"></aha-input>
    <aha-input prefix-shrink="start" prefix="https://presenter.ahaslides.com/survey/s/" value="team-pulse"></aha-input>
    <aha-input prefix-shrink prefix="aha.io/" value="team-pulse"></aha-input>
  </div>
</div>

<!-- Imports the REAL shipped element (../lib/aha-input.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Size / Status / Affix) is
     generated from contracts/input.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so the prefix/clear/reveal glyphs resolve from the DS library
  import '../lib/aha-input.js';   // registers <aha-input> — the shipped primitive, byte-identical to what consumers get
  for (const field of document.querySelectorAll('aha-input[data-select-on-focus]')) field.addEventListener('focusin', () => field.select());
</script>
