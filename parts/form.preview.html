<!-- ONE UI (React · antd v6), themed to DS V3 via the shared formTheme. Vue consumes the same
     formTheme — see "Show code". This CDN-React page (no build step) is also what qa.mjs
     measures: the real antd input + primary button bound to the shared theme. Interactive: the
     controls drive live React state (Layout / Size / Disabled), so the whole DS V3 matrix is
     explorable — the default render (vertical · default · enabled, a required Input + primary
     submit, plus an errored field with help text) is what conformance measures. -->
<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__form = {
  token: { colorPrimary:'#6A1EBB', borderRadius:8, controlHeight:32, colorBorder:'#E3E3E3',
           colorTextPlaceholder:'#8A8A8A', colorError:'#F5222D', fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif' },
  components:{ Form:{ labelColor:'#4A4A4A', itemMarginBottom:20, verticalLabelPadding:'0 0 4px' },
               Input:{ borderRadius:8, controlHeight:32 }, Button:{ borderRadius:8, controlHeight:32 } }
};
</script>

<script type="text/babel">
const { ConfigProvider, Form, Input, Button } = window.__antdR;
const { useState } = React;
const Item = Form.Item;

// A segmented control that mirrors the leaf smart-widget bar (.aha-pg styles from the doc shell),
// but wired to React state so an antd composite gets the same explorable playground.
function Seg({ label, value, onChange, options }) {
  return (
    <div className="aha-pg-row">
      <span className="aha-pg-label">{label}</span>
      <div className="aha-pg-seg" role="radiogroup" aria-label={label}>
        {options.map((o) => (
          <button key={String(o.value)} type="button" role="radio" aria-checked={o.value === value}
            className={'aha-pg-opt' + (o.value === value ? ' active' : '')}
            onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function Demo() {
  const [layout, setLayout] = useState('vertical');
  const [size, setSize] = useState('default');
  const [disabled, setDisabled] = useState(false);
  // A pre-filled invalid email so the error state (colorError border + help text) renders on load.
  const [form] = Form.useForm();
  React.useEffect(() => { form.validateFields(['email']).catch(() => {}); }, [form, layout, size, disabled]);
  return (
    <div style={{ maxWidth: layout === 'inline' ? 720 : 360 }}>
      {/* .aha-pg without data-pg → styled like the leaf widget bar, but driven by React, not PLAYGROUND_JS */}
      <div className="aha-pg" style={{ marginBottom: 18, borderRadius: 8, border: '1px solid var(--aha-split)' }}>
        <Seg label="Layout" value={layout} onChange={setLayout}
          options={[{ label: 'Vertical', value: 'vertical' }, { label: 'Horizontal', value: 'horizontal' }, { label: 'Inline', value: 'inline' }]} />
        <Seg label="Size" value={size} onChange={setSize}
          options={[{ label: 'Small', value: 'small' }, { label: 'Default', value: 'default' }, { label: 'Large', value: 'large' }]} />
        <Seg label="Disabled" value={disabled} onChange={setDisabled}
          options={[{ label: 'Off', value: false }, { label: 'On', value: true }]} />
      </div>
      <Form form={form} layout={layout} size={size} disabled={disabled} requiredMark
        labelCol={layout === 'horizontal' ? { span: 8 } : undefined}
        wrapperCol={layout === 'horizontal' ? { span: 16 } : undefined}
        initialValues={{ name: 'AhaSlides', email: 'not-an-email' }}>
        <Item label="Workspace name" name="name" rules={[{ required: true }]}>
          <Input placeholder="AhaSlides" />
        </Item>
        <Item label="Contact email" name="email"
          rules={[{ type: 'email', required: true, message: 'Enter a valid email — e.g. you@company.com' }]}>
          <Input placeholder="you@company.com" />
        </Item>
        <Item {...(layout === 'horizontal' ? { wrapperCol: { offset: 8, span: 16 } } : {})}>
          <Button type="primary" htmlType="submit">Save changes</Button>
        </Item>
      </Form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('react-root')).render(
  <ConfigProvider theme={window.__form}><Demo /></ConfigProvider>
);
</script>
