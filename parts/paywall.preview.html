<div class="pad" style="display:flex; justify-content:center; align-items:flex-start; padding:16px 24px 220px">
  <!-- ONE [data-probe] paywall, shown open so the popover anatomy (crown · label · body · unlock
       line · Upgrade CTA) is visible and measurable. The Plan playground drives required-plan on
       THIS element live. Wraps a gated affordance as its anchor. -->
  <aha-paywall data-probe open placement="bottom" feature-key="custom_survey_url"
    feature-label="Custom survey URL" body="Give your survey a branded, memorable link."
    required-plan="pro">
    <span class="lbl" style="margin:0">Custom URL</span>
  </aha-paywall>
</div>

<!-- Imports the REAL shipped element (../lib/aha-paywall.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. aha-paywall.js itself imports the icon registry, but we
     import it here too so the crown glyph resolves eagerly. The Plan control bar is generated from
     contracts/paywall.json → playground and drives required-plan on the [data-probe] element live. -->
<script type="module">
  import '../lib/icons.js';        // registers <aha-icon> + the registry (the crown badge comes from it)
  import '../lib/aha-paywall.js';  // registers <aha-paywall> — the shipped primitive, byte-identical to consumers'

  // demo only: don't navigate away from the docs when the CTA is clicked
  document.querySelector('aha-paywall[data-probe]').addEventListener('paywall-upgrade', (e) => e.preventDefault());
</script>
