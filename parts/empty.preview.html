<div class="pad">
  <div class="lbl">Empty · default illustration · a caption · an action</div>
  <div class="row" style="align-items:stretch; gap:24px; flex-wrap:wrap">
    <aha-empty data-probe description="No responses yet" style="border:1px solid var(--aha-split); border-radius:12px; width:260px"></aha-empty>
    <aha-empty image="simple" description="No results" style="border:1px solid var(--aha-split); border-radius:12px; width:260px"></aha-empty>
    <aha-empty description="No responses yet — share the join link" style="border:1px solid var(--aha-split); border-radius:12px; width:260px">
      <a slot="action" href="#" style="font:600 13px/1 var(--aha-font-product); color:var(--aha-text-link); text-decoration:none">Copy link</a>

<!-- Imports the REAL shipped element (../lib/aha-empty.js) + the icon library — no inlined copy, so
     the preview can never drift from lib/. The playground control bar (Image / Description) is
     generated from contracts/empty.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';       // registers <aha-icon> so a custom-image slot can resolve DS glyphs
  import '../lib/aha-empty.js';   // registers <aha-empty> — the shipped primitive, byte-identical to consumers'
</script>
