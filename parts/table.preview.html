<!-- ONE UI (React · antd v6), themed to DS V3 and customised per the Figma spec. Each card
     shows one customization case. Vue consumes the same DataTable API — see "Show code".
     React ≡ Vue parity is enforced separately by the hidden conformance harness (qa.mjs). -->
<style>
  /* DS-V3 table customisations (antd is native; we adjust the UI). Bound to --aha-* tokens.
     Filter/menu popovers render in a body portal, so these classes are intentionally global. */
  .aha-case { margin-bottom: 8px; }
  .aha-case > .lbl { margin-bottom: 10px; }
  .aha-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .aha-toolbar .ttl { font-size:18px; font-weight:600; color:var(--aha-text-default); }
  .aha-tbtns { display:flex; gap:8px; }
  /* DS V3 container — 1px border + radius 8 wrapping the whole grid (antd draws none) */
  #react-root .ant-table { border:1px solid var(--aha-border); border-radius:var(--aha-radius-default); overflow:hidden; }
  /* single-arrow sort (replaces antd's dual caret) */
  .ant-table-column-sorter { display:none !important; }
  .aha-sort { margin-left:6px; color:var(--aha-text-disabled); display:inline-flex; vertical-align:middle; }
  .ant-table-column-sort .aha-sort, .aha-sort.on { color:var(--aha-color-primary); }
  /* filter funnel */
  .aha-funnel { color:var(--aha-text-tertiary); display:inline-flex; }
  .aha-funnel.on { color:var(--aha-color-primary); }
  /* DS popover (filter + edit-columns) */
  .aha-pop { width:248px; font-family:var(--aha-font-product); }
  .aha-pop .aha-search { margin-bottom:10px; }
  .aha-pop .aha-list { max-height:190px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .aha-pop .aha-foot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .aha-reset { background:none; border:none; color:var(--aha-text-tertiary); cursor:pointer; font:inherit; padding:0; }
  .aha-reset:hover { color:var(--aha-text-secondary); }
  /* reorder — draggable headers + purple drop-line */
  .aha-th-grab { display:inline-flex; align-items:center; gap:6px; cursor:grab; }
  .aha-th-grab .dots { color:var(--aha-text-tertiary); display:inline-flex; }
  th.aha-drag-over { box-shadow: inset 2px 0 0 0 var(--aha-color-primary); }
  th.aha-dragging { background: var(--aha-gray-30) !important; opacity:.6; }
  /* resize — drag handle on the header's right edge */
  th.aha-rz-th { position:relative; }
  .aha-rz { position:absolute; right:-1px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:2; display:flex; justify-content:center; }
  .aha-rz::after { content:''; width:2px; background:transparent; }
  .aha-rz:hover::after, .aha-rz.on::after { background:var(--aha-color-primary); }
</style>

<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__aha = {
  theme: {
    token: { colorPrimary:'#6A1EBB', borderRadius:8, controlHeight:32,
             fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif',
             colorText:'#1A1A1A', colorTextSecondary:'#8A8A8A', colorBorderSecondary:'#E3E3E3' },
    components:{ Table:{ headerBg:'#ffffff', headerColor:'#8A8A8A', headerSplitColor:'transparent',
             borderColor:'#E3E3E3', rowHoverBg:'#F1F1F1', cellPaddingBlock:16, cellPaddingInline:16, headerBorderRadius:0 } }
  },
  rows: [
    { key:'1', name:'Mai Tran',  team:'Product', responses:25, score:1040 },
    { key:'2', name:'Sara Kim',  team:'Growth',  responses:24, score:980 },
    { key:'3', name:'John Lee',  team:'Growth',  responses:22, score:910 },
    { key:'4', name:'Ana Silva', team:'Product', responses:21, score:880 },
    { key:'5', name:'Diego Ruiz',team:'Sales',   responses:19, score:760 },
    { key:'6', name:'Tom Fox',   team:'Sales',   responses:18, score:720 },
    { key:'7', name:'Lena Park', team:'Product', responses:17, score:690 },
    { key:'8', name:'Omar Nadir',team:'Growth',  responses:15, score:610 }
  ]
};
</script>

<script type="text/babel">
const { ConfigProvider, Table, Button, Input, InputNumber, Checkbox, Popover, Space } = window.__antdR;
const { useState, useMemo, useRef, useCallback } = React;
const R = window.__aha;

/* --- inline DS icons (Phosphor-ish; a real app uses the shared Icon component) --- */
const Caret = ({dir}) => (
  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style={{transform:dir==='up'?'rotate(180deg)':'none'}}>
    <path d="M4 6l4 4 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>);
const Funnel = () => (
  <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 3h12l-4.5 5.5V13L6.5 11.5v-3L2 3z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>);
const Dots = () => (
  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12" cy="8" r="1.4"/></svg>);
const Columns = () => (
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="4.5" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/><rect x="9.5" y="3" width="4.5" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/></svg>);
const Download = () => (
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>);

const sortIcon = ({ sortOrder }) =>
  <span className={'aha-sort' + (sortOrder ? ' on' : '')}><Caret dir={sortOrder === 'ascend' ? 'up' : 'down'} /></span>;

function Section({ title, hint, children }) {
  return (
    <div className="aha-case">
      <div className="lbl">{title}{hint ? ' · ' + hint : ''}</div>
      {children}
    </div>
  );
}
function Toolbar({ extra }) {
  return (
    <div className="aha-toolbar">
      <span className="ttl">Leaderboard</span>
      <div className="aha-tbtns">
        {extra}
        <Button icon={<Download />}>Export</Button>
      </div>
    </div>
  );
}

/* --- DS filter popovers (antd filterDropdown render-prop = the "customise UI" hook) --- */
function ChecklistFilter({ setSelectedKeys, selectedKeys, confirm, clearFilters, options }) {
  const [q, setQ] = useState('');
  const shown = options.filter(o => o.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="aha-pop" style={{ padding: 4 }}>
      <Input className="aha-search" size="small" placeholder="Search in filters" value={q} onChange={e => setQ(e.target.value)} />
      <div className="aha-list">
        {shown.map(o => (
          <Checkbox key={o} checked={selectedKeys.includes(o)}
            onChange={e => setSelectedKeys(e.target.checked ? [...selectedKeys, o] : selectedKeys.filter(k => k !== o))}>{o}</Checkbox>
        ))}
      </div>
      <div className="aha-foot">
        <button className="aha-reset" onClick={() => { clearFilters && clearFilters(); confirm(); }}>Reset</button>
        <Button type="primary" size="small" onClick={() => confirm()}>Apply</Button>
      </div>
    </div>
  );
}
function RangeFilter({ setSelectedKeys, selectedKeys, confirm, clearFilters }) {
  const [min, max] = selectedKeys[0] ? selectedKeys[0].split('|') : ['', ''];
  const set = (lo, hi) => setSelectedKeys([`${lo}|${hi}`]);
  return (
    <div className="aha-pop" style={{ padding: 4 }}>
      <Space>
        <InputNumber size="small" placeholder="Min" defaultValue={min || undefined} onChange={v => set(v ?? '', max)} />
        <span style={{ color: 'var(--aha-text-tertiary)' }}>–</span>
        <InputNumber size="small" placeholder="Max" defaultValue={max || undefined} onChange={v => set(min, v ?? '')} />
      </Space>
      <div className="aha-foot">
        <button className="aha-reset" onClick={() => { clearFilters && clearFilters(); confirm(); }}>Reset</button>
        <Button type="primary" size="small" onClick={() => confirm()}>Apply</Button>
      </div>
    </div>
  );
}
const filterIcon = filtered => <span className={'aha-funnel' + (filtered ? ' on' : '')}><Funnel /></span>;

const COLS = {
  name: { key:'name', title:'Name', dataIndex:'name' },
  team: { key:'team', title:'Team', dataIndex:'team' },
  responses: { key:'responses', title:'Responses', dataIndex:'responses' },
  score: { key:'score', title:'Score', dataIndex:'score' },
};

/* Reorder — HTML5 drag on headers via onHeaderCell; purple drop-line on the drag-over cell.
   (antd's Table has no native column reorder — this is the "customise" layer, hand-rolled.) */
function ReorderDemo() {
  const [order, setOrder] = useState(['name','team','responses','score']);
  const [over, setOver] = useState(null);
  const drag = useRef(null);
  const move = (from, to) => setOrder(o => { if (from===to) return o; const a=o.filter(k=>k!==from); a.splice(a.indexOf(to),0,from); return a; });
  const cols = order.map(k => ({
    ...COLS[k],
    title: <span className="aha-th-grab"><span className="dots"><Dots /></span>{COLS[k].title}</span>,
    onHeaderCell: () => ({
      draggable: true,
      style: {
        cursor: 'grab',
        ...(over===k ? { boxShadow:'inset 2px 0 0 0 var(--aha-color-primary)' } : {}),
        ...(drag.current===k ? { opacity:.5, background:'var(--aha-gray-30)' } : {}),
      },
      onDragStart: () => { drag.current = k; },
      onDragOver: (e) => { e.preventDefault(); if (over!==k) setOver(k); },
      onDragLeave: () => setOver(o => o===k ? null : o),
      onDrop: (e) => { e.preventDefault(); move(drag.current, k); drag.current=null; setOver(null); },
      onDragEnd: () => { drag.current=null; setOver(null); },
    }),
  }));
  return <Table rowKey="key" columns={cols} dataSource={R.rows} pagination={false} />;
}

/* Resize — drag handle on each header's right edge, tracked in width state.
   (antd's Table has no native resize — hand-rolled via a custom header cell.) */
function ResizeDemo() {
  const [w, setW] = useState({ name:200, team:160, responses:160, score:160 });
  const wRef = useRef(w); wRef.current = w;
  const start = useCallback(key => e => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, w0 = wRef.current[key];
    const mv = ev => setW(p => ({ ...p, [key]: Math.max(80, w0 + ev.clientX - x0) }));
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  }, []);
  const components = useMemo(() => ({ header: { cell: props => {
    const { columnkey, children, className, ...rest } = props;
    return <th {...rest} className={(className||'') + ' aha-rz-th'}>{children}
      {columnkey ? <span className="aha-rz" onMouseDown={start(columnkey)} /> : null}</th>;
  } } }), [start]);
  const cols = ['name','team','responses','score'].map(k => ({ ...COLS[k], width:w[k], onHeaderCell: () => ({ columnkey:k }) }));
  return <Table rowKey="key" columns={cols} dataSource={R.rows} pagination={false}
    components={components} scroll={{ x: w.name + w.team + w.responses + w.score }} />;
}

function App() {
  /* edit-columns visibility */
  const [visible, setVisible] = useState(['name', 'team', 'responses', 'score']);
  const editable = ['team', 'responses', 'score'];
  const editPanel = (
    <div className="aha-pop">
      <div className="aha-list">
        <Checkbox checked disabled>Name</Checkbox>
        {editable.map(k => (
          <Checkbox key={k} checked={visible.includes(k)}
            onChange={e => setVisible(e.target.checked ? [...visible, k] : visible.filter(x => x !== k))}>{COLS[k].title}</Checkbox>
        ))}
      </div>
    </div>
  );

  const sortable = [
    { ...COLS.name, sorter:(a,b)=>a.name.localeCompare(b.name), sortIcon },
    COLS.team,
    { ...COLS.responses, sorter:(a,b)=>a.responses-b.responses, sortIcon },
    { ...COLS.score, sorter:(a,b)=>a.score-b.score, sortIcon, defaultSortOrder:'descend' },
  ];
  const filterable = [
    COLS.name,
    { ...COLS.team, filterIcon, onFilter:(v,r)=>r.team===v,
      filterDropdown: p => <ChecklistFilter {...p} options={['Product','Growth','Sales']} /> },
    COLS.responses,
    { ...COLS.score, filterIcon, onFilter:(v,r)=>{const[lo,hi]=String(v).split('|');return (!lo||r.score>=+lo)&&(!hi||r.score<=+hi);},
      filterDropdown: p => <RangeFilter {...p} /> },
  ];
  const wide = [
    { ...COLS.name, fixed:'left', width:180 },
    { ...COLS.team, width:160 }, { ...COLS.responses, width:160 }, { ...COLS.score, width:160 },
    { key:'accuracy', title:'Accuracy', dataIndex:'accuracy', width:160, render:()=> '86%' },
    { key:'time', title:'Avg time', dataIndex:'time', width:160, render:()=> '12s' },
  ];
  const editCols = [COLS.name, ...editable.filter(k=>visible.includes(k)).map(k=>COLS[k])];

  return (
    <ConfigProvider theme={R.theme}>
      <Space direction="vertical" size={28} style={{ display:'flex' }}>

        <Section title="Basic">
          <Toolbar />
          <Table rowKey="key" columns={[COLS.name,COLS.team,COLS.responses,COLS.score]} dataSource={R.rows} pagination={false} />
        </Section>

        <Section title="Sorting" hint="single directional arrow; click a header to cycle">
          <Table rowKey="key" columns={sortable} dataSource={R.rows} pagination={false} />
        </Section>

        <Section title="Filtering" hint="Team = checklist, Score = min/max range">
          <Table rowKey="key" columns={filterable} dataSource={R.rows} pagination={false} />
        </Section>

        <Section title="Config rows per page" hint='brand-outlined page + "N / page"'>
          <Table rowKey="key" columns={[COLS.name,COLS.team,COLS.responses,COLS.score]} dataSource={R.rows}
            pagination={{ pageSize:5, showSizeChanger:true, pageSizeOptions:['5','10','20'] }} />
        </Section>

        <Section title="Freeze column" hint="first column pinned; scroll horizontally">
          <Table rowKey="key" columns={wide} dataSource={R.rows} pagination={false} scroll={{ x: 980 }} />
        </Section>

        <Section title="Add / remove columns" hint="Edit columns → checklist">
          <Toolbar extra={
            <Popover trigger="click" placement="bottomRight" content={editPanel}>
              <Button icon={<Columns />}>Edit columns</Button>
            </Popover>} />
          <Table rowKey="key" columns={editCols} dataSource={R.rows} pagination={false} />
        </Section>

        <Section title="Reorder column" hint="drag a header to reorder; purple drop-line marks the target">
          <ReorderDemo />
        </Section>

        <Section title="Resize col-width" hint="drag the right edge of a header to resize">
          <ResizeDemo />
        </Section>

      </Space>
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById('react-root')).render(<App />);
</script>
