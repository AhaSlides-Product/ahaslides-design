<!-- ONE UI (React · antd v6), themed to DS V3 via the shared sliderTheme. Vue consumes the same
     sliderTheme — see "Show code". This CDN-React page (no build step) is also what qa.mjs
     measures: the real antd Slider bound to the shared theme. Interactive: the controls drive
     live React state (Type / Marks / Orientation / Disabled), so the whole DS V3 matrix is
     explorable — the default render (single · no marks · horizontal · enabled) is what
     conformance measures (brand track, gray-30 rail, 14px handle). -->
<div id="react-root" class="pad"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@6/dist/antd.min.js"></script>
<script>window.__antdR = window.antd;</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
window.__sl = {
  token: { colorPrimary:'#6A1EBB', borderRadius:8, fontFamily:'"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif' },
  components:{ Slider:{ railBg:'#F1F1F1', railHoverBg:'#E3E3E3', trackBg:'#6A1EBB', trackHoverBg:'#5715A0',
    handleColor:'#6A1EBB', handleActiveColor:'#5715A0', dotActiveBorderColor:'#6A1EBB', railSize:4, handleSize:14, handleSizeHover:16 } }
};
</script>

<script type="text/babel">
const { ConfigProvider, Slider } = window.__antdR;
const { useState } = React;

const marks = { 0: '0', 25: '25', 50: '50', 75: '75', 100: '100' };

// A segmented control that mirrors the leaf smart-widget bar (.aha-pg styles from the doc shell),
// but wired to React state so an antd composite gets the same explorable playground.
function Seg({ label, value, onChange, options }) {
  return (
    <div className="aha-pg-row">
      <span className="aha-pg-label">{label}</span>
      <div className="aha-pg-seg" role="radiogroup" aria-label={label}>
        {options.map((o) => (
          <button key={String(o.value)} type="button" role="radio" aria-checked={o.value === value}
            className={'aha-pg-opt' + (o.value === value ? ' active' : '')}
            onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function Demo() {
  const [type, setType] = useState('single');       // single | range
  const [showMarks, setShowMarks] = useState(false); // marks on/off
  const [vertical, setVertical] = useState(false);   // orientation
  const [disabled, setDisabled] = useState(false);

  const range = type === 'range';
  // Default (single · no marks · horizontal · enabled) is what conformance measures.
  const slider = (
    <Slider
      key={range ? 'range' : 'single'}
      range={range}
      defaultValue={range ? [20, 70] : 40}
      marks={showMarks ? marks : undefined}
      vertical={vertical}
      disabled={disabled}
    />
  );

  return (
    <div style={{ maxWidth: 620 }}>
      {/* .aha-pg without data-pg → styled like the leaf widget bar, but driven by React, not PLAYGROUND_JS */}
      <div className="aha-pg" style={{ marginBottom: 18, borderRadius: 8, border: '1px solid var(--aha-split)' }}>
        <Seg label="Type" value={type} onChange={setType}
          options={[{ label: 'Single', value: 'single' }, { label: 'Range', value: 'range' }]} />
        <Seg label="Marks" value={showMarks} onChange={setShowMarks}
          options={[{ label: 'Off', value: false }, { label: 'On', value: true }]} />
        <Seg label="Orientation" value={vertical} onChange={setVertical}
          options={[{ label: 'Horizontal', value: false }, { label: 'Vertical', value: true }]} />
        <Seg label="Disabled" value={disabled} onChange={setDisabled}
          options={[{ label: 'No', value: false }, { label: 'Yes', value: true }]} />
      </div>
      <div style={vertical ? { height: 240, paddingLeft: 8 } : { width: 320 }}>
        {slider}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('react-root')).render(
  <ConfigProvider theme={window.__sl}><Demo /></ConfigProvider>
);
</script>
