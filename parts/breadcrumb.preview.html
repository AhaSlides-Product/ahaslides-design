<div class="pad">
  <div class="lbl">Ancestor trail · leading icons · last item is the current page</div>
  <aha-breadcrumb data-probe separator="caret"
    items='[
      {"label":"Home","href":"#","icon":"system-house"},
      {"label":"Presentations","href":"#","icon":"system-folder"},
      {"label":"Team offsite","href":"#"},
      {"label":"Editor"}
    ]'>
  </aha-breadcrumb>

  <div class="lbl" style="margin-top:24px">Page title · the current crumb IS the page heading (never a plain &lt;h1&gt;)</div>
  <!-- size=page-title, single item → the standalone page title, a real <h1> at 24/600 -->
  <aha-breadcrumb data-probe-title size="page-title" heading-level="1"
    items='[{"label":"Presentations"}]'>
  </aha-breadcrumb>
  <!-- and the same size with an ancestor path in front of the heading (18/600) -->
  <aha-breadcrumb size="page-title" heading-level="1" style="margin-top:12px"
    items='[
      {"label":"Home","href":"#"},
      {"label":"Presentations","href":"#"},
      {"label":"Team offsite"}
    ]'>
  </aha-breadcrumb>
</div>

<!-- Imports the REAL shipped element (../lib/aha-breadcrumb.js) + the icon library — no inlined copy,
     so the preview can never drift from lib/. The playground control bar (Separator / Content, and a
     Collapse axis via maxItems) is generated from contracts/breadcrumb.json → playground and drives
     this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';           // registers <aha-icon> so the separator + leading glyphs resolve from the DS library
  import '../lib/aha-breadcrumb.js';  // registers <aha-breadcrumb> — the shipped primitive, byte-identical to what consumers get
</script>
