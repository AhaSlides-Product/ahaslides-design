<div class="pad">
  <div class="lbl">States · basic · checked · disabled</div>
  <div class="row">
    <aha-checkbox checked>Show correct answers</aha-checkbox>
    <aha-checkbox>Let participants join anonymously</aha-checkbox>
    <aha-checkbox disabled>Locked option</aha-checkbox>
    <aha-checkbox disabled checked>Locked on</aha-checkbox>
  </div>
  <div class="lbl">Group · check-all + indeterminate</div>
  <div class="stack">
    <aha-checkbox id="all">Select all</aha-checkbox>
    <div class="stack" style="padding-left:22px">
      <aha-checkbox class="child" checked>Poll</aha-checkbox>
      <aha-checkbox class="child">Quiz</aha-checkbox>
      <aha-checkbox class="child">Q&amp;A</aha-checkbox>
    </div>
  </div>
</div>

<script type="module">
import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';
class AhaCheckbox extends LitElement {
  static properties = { checked:{type:Boolean,reflect:true}, indeterminate:{type:Boolean,reflect:true}, disabled:{type:Boolean,reflect:true} };
  constructor(){ super(); this.checked=false; this.indeterminate=false; this.disabled=false; }
  static styles = css`
    :host{ display:inline-block }
    label{ display:inline-flex; align-items:center; gap:8px;
      font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif); font-size:14px; line-height:21px;
      color:var(--aha-text-default,#1A1A1A); cursor:pointer; user-select:none }
    :host([disabled]) label{ cursor:not-allowed; color:var(--aha-text-disabled,#B5B5B5) }
    input{ position:absolute; opacity:0; width:0; height:0; margin:0 }
    .box{ position:relative; flex:0 0 auto; width:14px; height:14px; box-sizing:border-box;
      border:1px solid var(--aha-checkbox-border,#D4D4D4); border-radius:4px;
      background:var(--aha-bg-container,#fff); transition:all var(--aha-motion-mid,.2s) var(--aha-ease-in-out,cubic-bezier(0.645,0.045,0.355,1)) }
    label:hover .box{ border-color:var(--aha-purple-30,#D3B4FF) }
    :host([disabled]) label:hover .box{ border-color:var(--aha-checkbox-border,#D4D4D4) }
    :host([checked]) .box, :host([indeterminate]) .box{ background:var(--aha-color-primary,#6A1EBB); border-color:var(--aha-color-primary,#6A1EBB) }
    :host([disabled]) .box, :host([disabled][checked]) .box{ background:var(--aha-bg-container-disabled,#F1F1F1); border-color:var(--aha-border-disabled,#EBEBEB) }
    svg{ position:absolute; inset:0; margin:auto; width:12px; height:12px }
    .bar{ position:absolute; inset:0; margin:auto; width:8px; height:2px; border-radius:1px; background:#fff }
    :host([disabled]) svg path{ stroke:var(--aha-text-disabled,#B5B5B5) }
    input:focus-visible + .box{ outline:2px solid var(--aha-color-primary,#6A1EBB); outline-offset:2px }
    @media (prefers-reduced-motion: reduce){ *{ transition:none !important } }
  `;
  updated(){ const i=this.renderRoot.querySelector('input'); if(i) i.indeterminate=this.indeterminate; }
  _toggle(e){ if(this.disabled){ e.preventDefault(); return; } this.checked=e.target.checked; this.indeterminate=false;
    this.dispatchEvent(new CustomEvent('change',{bubbles:true,composed:true,detail:{checked:this.checked}})); }
  render(){
    const glyph = this.indeterminate ? html`<span class="bar"></span>`
      : this.checked ? html`<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3 4.7 8.5 9.5 3.7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '';
    return html`<label><input type="checkbox" .checked=${this.checked} ?disabled=${this.disabled} @change=${this._toggle}/><span class="box">${glyph}</span><slot></slot></label>`;
  }
}
customElements.define('aha-checkbox', AhaCheckbox);
</script>

<script type="module">
// vanilla check-all wiring — proves the ONE element works with no framework at all
customElements.whenDefined('aha-checkbox').then(() => {
  const all = document.getElementById('all');
  const kids = [...document.querySelectorAll('.child')];
  const sync = () => { const n = kids.filter(k => k.checked).length; all.checked = n === kids.length; all.indeterminate = n > 0 && n < kids.length; };
  kids.forEach(k => k.addEventListener('change', sync));
  all.addEventListener('change', () => { const on = all.checked; kids.forEach(k => k.checked = on); all.indeterminate = false; });
  sync();
});
</script>
