<div class="pad">
  <div class="lbl">Paged list · 248 items · 20 per page · page 3 (ellipsis for the long range)</div>
  <aha-pagination data-probe total="248" page-size="20" current="3"></aha-pagination>

  <div class="lbl" style="margin-top:20px">Short range · no ellipsis</div>
  <aha-pagination pages="4" current="1"></aha-pagination>

  <div class="lbl" style="margin-top:20px">Small size</div>
  <aha-pagination pages="12" current="3" size="small"></aha-pagination>

  <div class="lbl" style="margin-top:20px">Simple mode · prev · n / total · next</div>
  <aha-pagination pages="12" current="3" simple></aha-pagination>

  <div class="lbl" style="margin-top:20px">Disabled (whole control)</div>
  <aha-pagination pages="12" current="3" disabled></aha-pagination>
</div>

<!-- Imports the REAL shipped element (../lib/aha-pagination.js) + the icon library — no inlined copy,
     so the preview can never drift from lib/. The playground control bar (Size / Mode) is generated
     from contracts/pagination.json → playground and drives this element's attributes live. -->
<script type="module">
  import '../lib/icons.js';          // registers <aha-icon> so the prev/next caret glyphs resolve from the DS library
  import '../lib/aha-pagination.js'; // registers <aha-pagination> — the shipped primitive, byte-identical to what consumers get
</script>
