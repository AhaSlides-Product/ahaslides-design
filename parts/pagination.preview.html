<div class="pad">
  <div class="lbl">Paged list · 248 items · 20 per page · page 3</div>
  <aha-pagination data-probe total="248" page-size="20" current="3"></aha-pagination>

  <div class="lbl" style="margin-top:20px">Short range · no ellipsis</div>
  <aha-pagination total="60" page-size="20" current="1"></aha-pagination>
</div>

<!-- Renders the SAME element shipped as @ahaslides-product/design/aha-pagination (lib/aha-pagination.js),
     inlined here so the preview is self-contained (no build step, no network). -->
<script type="module">
import '../lib/icons.js';   // registers <aha-icon> so the prev/next caret glyphs resolve from the DS library
const STYLE = `
  :host{ display:block; font-family:var(--aha-font-product,"Plus Jakarta Sans",sans-serif); font-size:13px }
  .pg{ display:flex; align-items:center; gap:6px }
  .page,.nav-btn{ box-sizing:border-box; min-width:32px; height:32px; padding:0 6px;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--aha-border,#E3E3E3); border-radius:var(--aha-radius-default,8px);
    background:var(--aha-bg-container,#FFFFFF); color:var(--aha-text-default,#1A1A1A);
    font:inherit; font-weight:600; cursor:pointer;
    transition:background var(--aha-motion-fast,.1s) var(--aha-ease-out,cubic-bezier(0.215,0.61,0.355,1)), border-color var(--aha-motion-fast,.1s) var(--aha-ease-out,cubic-bezier(0.215,0.61,0.355,1)), color var(--aha-motion-fast,.1s) var(--aha-ease-out,cubic-bezier(0.215,0.61,0.355,1)) }
  .page:not(.current):hover,.nav-btn:not([disabled]):hover{ border-color:var(--aha-border-hover,#D3B4FF); color:var(--aha-color-primary,#6A1EBB) }
  .page:focus-visible,.nav-btn:focus-visible{ outline:2px solid var(--aha-border-focus,#D3B4FF); outline-offset:2px }
  .page.current{ background:var(--aha-color-primary,#6A1EBB); border-color:var(--aha-color-primary,#6A1EBB); color:var(--aha-text-inverse,#FFFFFF) }
  .nav-btn[disabled]{ color:var(--aha-text-disabled,#B5B5B5); border-color:var(--aha-border-disabled,#EBEBEB); cursor:not-allowed }
  .ellipsis{ min-width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; color:var(--aha-text-tertiary,#8A8A8A) }
`;
function pageList(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const out = [1];
  const lo = Math.max(2, current - 1), hi = Math.min(total - 1, current + 1);
  if (lo > 2) out.push('…');
  for (let p = lo; p <= hi; p++) out.push(p);
  if (hi < total - 1) out.push('…');
  out.push(total);
  return out;
}
class AhaPagination extends HTMLElement {
  static get observedAttributes() { return ['total', 'page-size', 'current']; }
  connectedCallback() { if (!this.shadowRoot) this.attachShadow({ mode: 'open' }); this._render(); }
  attributeChangedCallback() { if (this.shadowRoot) this._render(); }
  get totalPages() { return Math.max(1, Math.ceil(Number(this.getAttribute('total') || 0) / Number(this.getAttribute('page-size') || 10))); }
  get current() { return Math.min(this.totalPages, Math.max(1, Number(this.getAttribute('current') || 1))); }
  _go(page) {
    const p = Math.min(this.totalPages, Math.max(1, page));
    if (p === this.current) return;
    this.setAttribute('current', String(p));
    this.dispatchEvent(new CustomEvent('change', { bubbles: true, composed: true, detail: { page: p } }));
  }
  _render() {
    const cur = this.current, total = this.totalPages;
    const nav = (dir, name, disabled) =>
      `<button class="nav-btn" part="nav" data-dir="${dir}" ${disabled ? 'disabled' : ''} aria-label="${dir === -1 ? 'Previous page' : 'Next page'}"><aha-icon name="system-caret-${dir === -1 ? 'left' : 'right'}" size="16" decorative></aha-icon></button>`;
    const pages = pageList(cur, total).map((p) => p === '…'
      ? `<span class="ellipsis" part="ellipsis">…</span>`
      : `<button class="page${p === cur ? ' current' : ''}" part="page" data-page="${p}" ${p === cur ? 'aria-current="page"' : ''}>${p}</button>`).join('');
    this.shadowRoot.innerHTML = `<style>${STYLE}</style><nav class="pg" part="pg" aria-label="Pagination">${nav(-1, 'prev', cur <= 1)}${pages}${nav(1, 'next', cur >= total)}</nav>`;
    this.shadowRoot.querySelectorAll('.page').forEach((b) => b.addEventListener('click', () => this._go(Number(b.getAttribute('data-page')))));
    this.shadowRoot.querySelectorAll('.nav-btn').forEach((b) => b.addEventListener('click', () => { if (!b.hasAttribute('disabled')) this._go(cur + Number(b.getAttribute('data-dir'))); }));
  }
}
customElements.define('aha-pagination', AhaPagination);
</script>
