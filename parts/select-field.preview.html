<div class="pad">
  <div class="lbl">Try it with the controls</div>
  <div class="demo-stage">
    <aha-select data-probe placeholder="Pick a theme"
      options='[{"label":"Light","value":"light"},{"label":"Dark","value":"dark"},{"label":"High contrast","value":"contrast"}]'></aha-select>
  </div>


  <div class="lbl">States</div>
  <div class="row" style="align-items:center; gap:12px; flex-wrap:wrap">
    <aha-select placeholder="Select a language"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
    <aha-select value="en"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
    <aha-select status="error" error-message="Choose a language" placeholder="Required"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
    <aha-select status="warning" value="en"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
    <aha-select disabled value="en"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
  </div>

  <div class="lbl">Opt-in: allow-clear, show-search, option description, popup-width</div>
  <div class="row" style="align-items:flex-start; gap:12px; flex-wrap:wrap">
    <aha-select allow-clear value="en" aria-label="Language"
      options='[{"label":"English","value":"en"},{"label":"Tiếng Việt","value":"vi"}]'></aha-select>
    <aha-select show-search placeholder="Jump to a page" aria-label="Jump to a page"
      options='[{"label":"Welcome","value":"p1"},{"label":"About you","value":"p2"},{"label":"Your experience","value":"p3"},{"label":"Feedback","value":"p4"},{"label":"Thank you","value":"p5"}]'></aha-select>
    <aha-select value="editor" popup-width="content" style="--aha-field-width:120px" aria-label="Role"
      options='[{"label":"Editor","value":"editor","description":"Edit and view results"},{"label":"Viewer","value":"viewer","description":"View results only"}]'></aha-select>
  </div>

  <div class="lbl">Opt-in: loading, server search (filter="off"), rich options with a selected label, width="content"</div>
  <div class="row" style="align-items:flex-start; gap:12px; flex-wrap:wrap">
    <aha-select loading show-search filter="off" placeholder="Search presentations" aria-label="Search presentations"></aha-select>
    <aha-select show-search filter="off" placeholder="Search presentations" empty-text="No presentations found" aria-label="Presentation"
      options='[{"label":"Quarterly review","value":"7"},{"label":"Kick-off","value":"9"}]'></aha-select>
    <aha-select show-search width="content" value="44" aria-label="Country code"
      options='[{"label":"United Kingdom","value":"44","prefix":"🇬🇧","suffix":"+44","selectedLabel":"🇬🇧 +44"},{"label":"Viet Nam","value":"84","prefix":"🇻🇳","suffix":"+84","selectedLabel":"🇻🇳 +84"},{"label":"United States","value":"1","prefix":"🇺🇸","suffix":"+1","selectedLabel":"🇺🇸 +1"}]'></aha-select>
    <aha-select width="content" value="editor" aria-label="Role"
      options='[{"label":"Editor","value":"editor","description":"Edit and view results"},{"label":"Viewer","value":"viewer","description":"View results only"}]'></aha-select>
  </div>

  <div class="lbl">Opt-in: mode="tags" (free entry)</div>
  <div class="row" style="align-items:flex-start; gap:12px; flex-wrap:wrap">
    <aha-select mode="tags" separators=", ;" placeholder="name@example.com" aria-label="Recipients" style="--aha-field-width:min(100%, 380px)"
      values='["ana@example.com","binh@example.com"]'></aha-select>
    <aha-select mode="tags" placeholder="Add a keyword" aria-label="Keywords" style="--aha-field-width:min(100%, 380px)"></aha-select>
  </div>

  <div class="lbl">In a settings row</div>
  <aha-settings-list style="max-width:380px; display:block"
    schema='{"sections":[{"label":"Presentation","rows":[
      {"key":"theme","label":"Slide theme","control":{"type":"select","value":"light","options":[{"label":"Light","value":"light"},{"label":"Dark","value":"dark"}]}},
      {"key":"progressBar","label":"Progress bar","control":{"type":"switch","checked":true}}
    ]}]}'></aha-settings-list>
</div>

<!-- Imports the REAL shipped element (../lib/aha-select.js) + the icon library (the caret) + the
     settings-list it embeds into — no inlined copy, so the preview can never drift from lib/. The
     playground control bar (Size / Status / Disabled) is generated from contracts/select-field.json →
     playground and drives the [data-probe] element's attributes live. -->
<script type="module">
  import '../lib/icons.js';               // registers <aha-icon> — the trailing caret glyph
  import '../lib/aha-select.js';          // registers <aha-select> — the shipped primitive, byte-identical to consumers'
  import '../lib/aha-settings-list.js';   // registers <aha-settings-list> — it reuses <aha-select> as a schema control
</script>
