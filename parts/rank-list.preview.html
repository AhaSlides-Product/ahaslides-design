<div class="pad">
  <div class="lbl">Light deck</div>
  <div class="row" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;box-sizing:border-box">
    <aha-rank-list data-probe group-label="Order by size" options='[{"id":"j","label":"Jupiter"},{"id":"e","label":"Earth"},{"id":"m","label":"Mars"}]'></aha-rank-list>
  </div>
  <div class="lbl">Dark deck — applyDeck() with a white ink and a Vivid Pink accent</div>
  <div class="row aud-dark" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;box-sizing:border-box;padding:var(--aha-space-16);background:var(--aha-bg-dark);border-radius:var(--aha-radius-lg)">
    <aha-rank-list group-label="Order by size" options='[{"id":"j","label":"Jupiter"},{"id":"e","label":"Earth"},{"id":"m","label":"Mars"}]'></aha-rank-list>
  </div>
  <div class="lbl">Long text and picture (expandable): 4 lines, More, picture on the left; press More or the picture to open the modal</div>
  <div class="row aud-dark" style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;box-sizing:border-box;padding:var(--aha-space-16);background:var(--aha-bg-dark);border-radius:var(--aha-radius-lg)">
    <aha-rank-list expandable id="long-rank" group-label="Order by length"></aha-rank-list>
  </div>
  <aha-option-modal inline id="rank-sheet" style="display:block;max-width:420px"></aha-option-modal>
</div>

<!-- Imports the REAL shipped element, so the preview can never drift from lib/ and qa measures what consumers get. -->
<script type="module">
  import '../lib/aha-rank-list.js';   // registers <aha-rank-list>
  import '../lib/aha-option-modal.js';   // registers <aha-option-modal>
  import { applyDeck } from '../lib/audience-deck.js';
  for (const deck of document.querySelectorAll('.aud-dark')) applyDeck(deck, { textColour: '#FFFFFF', presentationColorPalette: ['#E70E68'] });
  const picture = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23E70E68' fill-opacity='.15'/%3E%3Ccircle cx='200' cy='130' r='60' fill='%23E70E68'/%3E%3Crect x='120' y='210' width='160' height='24' rx='12' fill='%231A1A1A' fill-opacity='.7'/%3E%3C/svg%3E";
  const longRank = document.getElementById('long-rank');
  const longOptions = [
    { id: 'a', label: 'Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday Monday', image: picture },
    { id: 'b', label: 'Short option' },
    { id: 'c', label: 'Short with picture', image: picture },
    { id: 'd', label: 'Default row, plain' },
  ];
  longRank.options = longOptions;
  const sheet = document.getElementById('rank-sheet');
  const showOption = (option) => {
    sheet.textContent = option.label;
    if (option.image) sheet.setAttribute('image', option.image); else sheet.removeAttribute('image');
    sheet.setAttribute('open', '');
  };
  longRank.addEventListener('expand', (event) => showOption(longOptions.find((candidate) => candidate.id === event.detail.id)));
  showOption(longOptions[0]);
</script>
