<div class="pad">
  <div class="lbl">Stage, with the bar, in a 16:9 slide frame</div>

<script type="module">
  import '../lib/icons.js';
  import '../lib/aha-leaderboard.js';
  import '../lib/aha-button.js';
  document.getElementById('lb-winner-toggle').addEventListener('click', () => { const board = document.getElementById('lb-winner'); board.hideWinner(); board.getBoundingClientRect(); board.showWinner(); });
