<style>
:where(.rules-page){
--ink:#1a1a1a; /* ds-lint-allow: hex (palette token) */
--ink-2:#4a4a4a; /* ds-lint-allow: hex (palette token) */
--line:#e4e4e4; /* ds-lint-allow: hex (palette token) */
--page:#ffffff; /* ds-lint-allow: hex (palette token) */
--pink:{{vividPink}}; /* ds-lint-allow: hex (palette token) */
--pink-dark:{{darkerPink}}; /* ds-lint-allow: hex (palette token) */
--pink-5:{{vividPink5}}; /* ds-lint-allow: hex (palette token) */
--pink-30:{{vividPink30}}; /* ds-lint-allow: hex (palette token) */
--purple:{{purple}}; /* ds-lint-allow: hex (palette token) */
--grey-light:#A8A8A8; /* ds-lint-allow: hex (palette token) */
--grey-faint:#FAFAFA; /* ds-lint-allow: hex (palette token) */
--swatch-edge:rgba(0,0,0,.16);
--shadow:rgba(0,0,0,.12);
}
.rules-page .lede{color:var(--ink-2);font-size:17px;margin:0 0 20px}
.rules-page h3.sub{margin-top:24px}
.rules-page .num{display:inline-block;min-width:1.6em;color:var(--ink-2)}
.rules-page pre{margin:0 0 12px;padding:12px 16px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--grey-faint)}
.rules-page .table-wrap{margin:0 0 12px}
.rules-page table{border-collapse:collapse;width:100%;font-size:15px}
.rules-page th,.rules-page td{text-align:left;vertical-align:top;padding:10px 16px 10px 0;border-bottom:1px solid var(--line)}
.rules-page th{font-weight:600;font-size:13px;color:var(--ink-2)}
.rules-page td:first-child{font-weight:600}
.rules-page .swatch{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--swatch-edge);vertical-align:-3px;flex:none}
.rules-page .sw-pink{background:var(--pink)}.rules-page .sw-pinkdark{background:var(--pink-dark)}.rules-page .sw-white{background:var(--page)}
.rules-page .sw-pink5{background:var(--pink-5)}.rules-page .sw-pink30{background:var(--pink-30)}.rules-page .sw-purple{background:var(--purple)}
.rules-page .sw-grey{background:var(--grey-light)}.rules-page .sw-faint{background:var(--grey-faint)}
.rules-page .chip{display:inline-flex;align-items:center;gap:8px;margin:2px 6px 2px 0;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);font:inherit;cursor:pointer;max-width:100%}
.rules-page .chip:hover{background:var(--pink-5)}
.rules-page .chip:focus-visible,.rules-page a:focus-visible,.rules-page summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rules-page .chip .hint{font-size:12px;color:var(--ink-2)}
.rules-page .chip.copied .hint{color:var(--ink);font-weight:600}
.rules-page .glance{background:var(--pink-5);border-radius:12px;padding:20px 20px 12px;margin:0 0 8px}
.rules-page .glance ol{margin:0;padding-left:22px}
.rules-page .changes{list-style:none;padding:0}
.rules-page .changes li{display:grid;grid-template-columns:36px 56px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.rules-page .ver{font-weight:600}.rules-page .date{color:var(--ink-2)}
.rules-page .toc{list-style:none;margin:0;padding:0 16px 8px}
.rules-page .toc li{margin:0}
.rules-page .toc a{display:block;padding:6px 0}
.rules-page .updated{color:var(--ink-2);font-size:14px;margin:0 0 20px}
.rules-page .panel{border:1px solid var(--line);border-radius:12px;margin:0 0 12px}
.rules-page .panel>summary{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:600;list-style:none}
.rules-page .panel>summary::-webkit-details-marker{display:none}
.rules-page .panel>summary:hover{background:var(--pink-5)}
.rules-page .panel>summary::after{content:"Show";margin-left:auto;font-weight:400;font-size:14px;color:var(--ink-2)}
.rules-page .panel[open]>summary::after{content:"Hide"}
.rules-page .panel-caret{display:inline-flex;transition:transform .2s ease-out}
.rules-page .panel[open] .panel-caret{transform:rotate(90deg)}
.rules-page .panel-body{padding:4px 16px 8px}
@media (prefers-reduced-motion:reduce){.rules-page .panel-caret{transition:none}}
.rules-page [id]{scroll-margin-top:80px}
@media (max-width:600px){.rules-page th,.rules-page td{padding-right:10px}.rules-page table{font-size:14px}.rules-page .changes li{grid-template-columns:32px 1fr}.rules-page .changes li span:last-child{grid-column:1/-1}}
</style>
<div class="rules-page">
<h1>{{title}}</h1>
<p class="lede rules-lede">{{lede}}</p>
<details class="toc-wrap panel" id="toc"><summary>Contents</summary><nav aria-label="Contents"><ol class="toc">{{contents}}<li><a href="#changes">What changed</a></li></ol></nav></details>
<p class="updated">Last updated {{updated}}</p>
{{related}}
<section class="glance" aria-labelledby="glance-h"><h3 id="glance-h">The rules at a glance</h3><ol>{{glance}}</ol></section>
{{sections}}

<h2 id="changes">What changed</h2>
<ul class="changes">{{changes}}</ul>
<p class="updated">Last updated {{updated}}</p>
</div>
<script>
(function(){
if(window.__rulesPageCopy)return;window.__rulesPageCopy=true;
document.addEventListener('click',function(e){
var b=e.target.closest('.rules-page .chip');if(!b)return;
var v=b.getAttribute('data-copy'),h=b.querySelector('.hint');
function done(){b.classList.add('copied');h.textContent='Copied';setTimeout(function(){b.classList.remove('copied');h.textContent='Copy';},1400);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(done,fallback);}else fallback();
function fallback(){var t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(x){}document.body.removeChild(t);done();}
});
})();
</script>
