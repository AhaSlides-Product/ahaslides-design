<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search in a modal | AhaSlides</title>
<link rel="stylesheet" href="../../../lib/tokens.css">
<script type="module" src="../../../lib/aha-input.js"></script>
<script type="module" src="../../../lib/aha-modal.js"></script>
<style>
  .row { height: 48px; }
</style>
</head>
<body>
  <aha-modal open inline heading="Add a slide" no-footer closable="false">
    <aha-input placeholder="Search slides" aria-label="Search slides"></aha-input>
    <div class="row">Rating</div>
    <div class="row">Poll</div>
    <div class="row">Quiz</div>
    <div class="row">Word cloud</div>
    <div class="row">Spinner wheel</div>
    <div class="row">Open ended</div>
    <div class="row">Q&amp;A</div>
    <div class="row">Scales</div>
    <div class="row">Ranking</div>
    <div class="row">Pin on image</div>
    <div class="row">Brainstorm</div>
    <div class="row">Matching pairs</div>
  </aha-modal>
</body>
</html>
