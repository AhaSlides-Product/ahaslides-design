<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select clear, search, option description and popup width</title>
</head>
<body>
  <aha-select id="plain" value="b" options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}]'></aha-select>
  <aha-select id="clearable" allow-clear value="b" options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}]'></aha-select>
  <aha-select id="search" show-search options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"},{"label":"Gamma","value":"g"},{"label":"Alphabet","value":"ab","disabled":true}]'></aha-select>
  <aha-select id="rich" options='[{"label":"Editor","value":"editor","description":"Edit and view results","title":"Can edit"}]'></aha-select>
  <aha-select id="match" popup-width="match" style="--aha-field-width:300px" options='[{"label":"A","value":"a"}]'></aha-select>
  <aha-select id="fixed" popup-width="180" options='[{"label":"A much longer option label than the control","value":"a"}]'></aha-select>
  <script type="module">
    await import('../lib/aha-select.js');
    await customElements.whenDefined('aha-select');
    window.selectOptionsFixtureReady = true;
  </script>
</body>
</html>
