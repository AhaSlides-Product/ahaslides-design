<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select clear, search, option description and popup width</title>
</head>
<body>
  <aha-select id="plain" value="b" options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}]'></aha-select>
  <aha-select id="clearable" allow-clear value="b" options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}]'></aha-select>
  <aha-select id="search" show-search options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"},{"label":"Gamma","value":"g"},{"label":"Alphabet","value":"ab","disabled":true}]'></aha-select>
  <aha-select id="rich" options='[{"label":"Editor","value":"editor","description":"Edit and view results","title":"Can edit"}]'></aha-select>
  <aha-select id="match" popup-width="match" style="--aha-field-width:300px" options='[{"label":"A","value":"a"}]'></aha-select>
  <aha-select id="fixed" popup-width="180" options='[{"label":"A much longer option label than the control","value":"a"}]'></aha-select>
  <aha-select id="server" show-search filter="off" loading placeholder="Search presentations"></aha-select>
  <aha-select id="role" width="content" value="editor" options='[{"label":"Editor","value":"editor"},{"label":"Viewer only","value":"viewer"}]'></aha-select>
  <aha-select id="country" show-search value="44" options='[{"label":"United Kingdom","value":"44","prefix":"🇬🇧","suffix":"+44","selectedLabel":"🇬🇧 +44"},{"label":"Viet Nam","value":"84","prefix":"🇻🇳","suffix":"+84","selectedLabel":"🇻🇳 +84"}]'></aha-select>
  <aha-select id="tags" mode="tags" separators=", ;" placeholder="name@example.com" values='["a@b.c"]'></aha-select>
  <aha-card id="clip-card" style="display:block; width:280px; height:72px"><aha-select id="clipped" value="b" options='[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"},{"label":"Gamma","value":"g"},{"label":"Delta","value":"d"}]'></aha-select></aha-card>
  <aha-select id="grow" show-search filter="off" loading style="position:fixed; left:0" placeholder="Search"></aha-select>
  <aha-select id="collapse" mode="multiple" allow-clear max-tag-count="responsive" more-label="{count} others" aria-label="Departments" style="--aha-field-width:300px" values='["a","b","c","d","e","f"]' options='[{"label":"Customer success","value":"a"},{"label":"Engineering","value":"b"},{"label":"Marketing","value":"c"},{"label":"Operations","value":"d"},{"label":"Sales","value":"e"},{"label":"Finance","value":"f"}]'></aha-select>
  <aha-select id="multi" mode="multiple" allow-clear max-count="2" values='["c1"]' aria-label="Courses" options='[{"label":"Algebra","value":"c1","suffix":"12"},{"label":"Biology","value":"c2","suffix":"8","ariaLabel":"Biology, 8 lessons"},{"label":"Chemistry","value":"c3","suffix":"5"}]'></aha-select>
  <aha-select id="multi-search" mode="multiple" show-search filter-prop="title" aria-label="Presentations" options='[{"label":"Courses","options":[{"label":"Intro","value":"i","title":"Onboarding course"},{"label":"Advanced","value":"a","title":"Expert track"}]},{"label":"Drafts","options":[{"label":"Untitled","value":"u","title":"Draft"}]}]'></aha-select>
  <aha-select id="tags-suggest" mode="tags" aria-label="Cities" options='["Paris","Prague","Oslo"]'></aha-select>
  <aha-select id="grouped" show-search value="apple" aria-label="Food" options='[{"label":"Fruit","options":[{"label":"Apple","value":"apple"},{"label":"Banana","value":"banana"}]},{"label":"Vegetables","options":[{"label":"Carrot","value":"carrot"}]}]'></aha-select>
  <aha-autocomplete id="ac" aria-label="Region" options='[{"label":"Europe","value":"eu","suffix":"EU"},{"label":"Asia","value":"as","suffix":"APAC","ariaLabel":"Asia, Asia-Pacific"}]'></aha-autocomplete>
  <script type="module">
    await import('../lib/aha-select.js');
    await import('../lib/aha-card.js');
    await import('../lib/aha-autocomplete.js');
    await customElements.whenDefined('aha-select');
    window.selectOptionsFixtureReady = true;
  </script>
</body>
</html>
