<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button text-link underline</title>
</head>
<body>
  <aha-button id="link" variant="text-link">View details</aha-button>
  <p id="plain" style="margin:0; width:520px; font:400 14px/1.5 sans-serif">A sentence with no control in it at all.</p>
  <p id="sentence" style="margin:0; width:520px; font:400 14px/1.5 sans-serif">A sentence with a <aha-button id="toggle" variant="text-link" size="inline" aria-expanded="false">toggle</aha-button> and a <aha-button id="anchor" variant="text-link" size="inline" href="#plans">link</aha-button> in it.</p>
  <p id="wrapped" style="margin:0; width:120px; font:400 14px/1.5 sans-serif">Long <aha-button id="long" variant="text-link" size="inline" href="#plans">link that has to wrap over two lines</aha-button> here.</p>
  <p id="grown" style="margin:0; width:520px; font:400 14px/1.5 sans-serif">A sentence with <aha-button id="busy" variant="text-link" size="inline" loading>a spinner</aha-button> and <aha-button variant="text-link" size="inline"><span slot="icon" style="display:block;height:16px"></span>an icon</aha-button> in it.</p>
  <p id="narrow" style="margin:0; width:120px; font:400 14px/1.5 sans-serif"><aha-button id="long-toggle" variant="text-link" size="inline">a toggle label that has to wrap inside itself</aha-button></p>
  <script type="module">
    await import('../lib/aha-button.js');
    await customElements.whenDefined('aha-button');
    window.textLinkFixtureReady = !!document.querySelector('#link').shadowRoot?.querySelector('button');
  </script>
</body>
</html>
