<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/tokens.css">
<button id="opener">Open</button>
<aha-drawer id="drawer" heading="Participant report">
  <p>Body</p>
  <button id="inside-a">A</button>
  <button id="inside-b">B</button>
  <div slot="footer"><button id="footer-button">Done</button></div>
</aha-drawer>
<aha-drawer id="sheet" placement="bottom" heading="Fire safety refresher">
  <span slot="subtitle">10 slides · Updated 2 days ago · Private</span>
  <div slot="actions"><button id="more" aria-haspopup="menu" aria-expanded="false">More</button></div>
  <p>Sheet body</p>
  <button id="accordion" aria-expanded="true">Section</button>
  <aha-menu id="menu" items='[{"key":"a","label":"Assign"}]'></aha-menu>
  <div slot="footer"><button id="sheet-next">Next</button></div>
</aha-drawer>
<script type="module">
  import '../lib/aha-menu.js';
  import '../lib/aha-drawer.js';
  await customElements.whenDefined('aha-drawer');
  window.drawerFixtureReady = true;
</script>
