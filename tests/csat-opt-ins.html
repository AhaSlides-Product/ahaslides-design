<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSAT opt-ins</title>
<link rel="stylesheet" href="../lib/tokens.css">
<style>body{margin:24px} aha-csat{display:block;margin-bottom:200px}</style>
</head>
<body>
  <aha-csat id="plain" prompt="How did this go?" source="plain"></aha-csat>
  <aha-csat id="any" prompt="How did this go?" source="any" feedback-on="any" confirmation="Thanks, feedback received"></aha-csat>
  <aha-csat id="mixed" prompt="How did this go?" source="mixed" feedback-on="any" feedback-button feedback-placeholder="Tell us more" feedback-button-placeholder="Share your thoughts"></aha-csat>
  <aha-csat id="hint" prompt="How did this go?" source="hint" feedback-on="any" feedback-button feedback-hint="What you write goes to the developer"></aha-csat>
  <aha-csat id="stacked" prompt="How did this go?" source="stacked" layout="stacked" confirmation="Thanks, feedback received"></aha-csat>
  <aha-csat id="inline" prompt="How did this go?" source="inline" layout="stacked" feedback-display="inline" feedback-button feedback-prompt="Tell us more" confirmation="Thanks, feedback received"></aha-csat>
  <div id="narrow" style="width:200px;padding:8px;border:1px solid #ccc;overflow:auto;margin-bottom:200px">
    <aha-csat id="rated" prompt="How did this go?" source="rated" layout="stacked" feedback-display="inline" feedback-on="any" feedback-button feedback-prompt="Tell us more" confirmation="Thanks, feedback received" confirmation-like="You liked this. Thanks for letting us know!" confirmation-dislike="You didn't like this. Thanks for being honest."></aha-csat>
  </div>
  <aha-csat id="likeonly" prompt="How did this go?" source="likeonly" feedback-button confirmation-like="You liked this"></aha-csat>
  <script type="module">
    await import('../lib/aha-csat.js');
    window.csatFixtureReady = true;
  </script>
</body>
</html>
