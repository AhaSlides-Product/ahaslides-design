name: standards

# The reusability GATE, enforced on every PR — regardless of which device or agent authored it.
# A component that isn't complete + declared + importable + registered fails this, and the PR
# can't merge. `standards.mjs` is Node-only (no browser), so it's deterministic in CI.
#
# The render gate (`qa.mjs`) measures the REAL rendered UI in headless Chrome. It now runs in CI
# too: Chrome is installed here and passed via CHROME_BIN, which cdp.mjs/qa.mjs honour.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  standards:
    name: component standards gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      # No dependencies — the pipeline is pure Node scripts + the repo's own sources.
      - name: Build (icon registry + lib entry points + dist)
        run: node build-icons.mjs && node generate.mjs
      - name: Component standards gate (reusable or it fails)
        run: node standards.mjs
      - name: Render truth (real UI matches each contract)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node qa.mjs
