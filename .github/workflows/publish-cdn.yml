name: publish-cdn

# Mirrors the browser files (lib/ plus the fonts/ and logo/ folders lib/ loads by ../ URL) to the
# AhaSlides public bucket, served by CloudFront, so a page can load the design system from a CDN
# we own and invalidate instead of jsDelivr, whose @latest some providers keep stale for a day:
#
#   https://assets-cdn-public.ahaslides.com/ahaslides-design/latest/lib/canvas.js       5-minute cache
#   https://assets-cdn-public.ahaslides.com/ahaslides-design/<version>/lib/canvas.js    immutable
#
# Same bucket, distribution and secrets as aha-slide-plugin's build-standalone-cdn.yml.
# Every lib/ change ships with a version bump (standards.mjs), so a push to master is a release.
# Manual re-publish / backfill: run this workflow via workflow_dispatch on master.

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'fonts/**'
      - 'logo/**'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest run may write latest/: an older run finishing last would regress it.
concurrency:
  group: publish-cdn
  cancel-in-progress: true

env:
  BUCKET: public.ahaslides.com
  DISTRIBUTION_ID: E1JH605NRNF1T6
  PUBLIC_BASE: https://assets-cdn-public.ahaslides.com
  PREFIX: ahaslides-design

jobs:
  publish-cdn:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check for the AWS secrets
        id: secrets
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set on this repo, so nothing was published to ${PUBLIC_BASE}. An org admin must share the aha-slide-plugin CDN secrets with ahaslides-design."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - name: Upload to the public bucket
        if: steps.secrets.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for DIR in lib fonts logo; do
            aws s3 sync "$DIR" "s3://${BUCKET}/${PREFIX}/${VERSION}/${DIR}" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 sync "$DIR" "s3://${BUCKET}/${PREFIX}/latest/${DIR}" --delete \
              --cache-control "public, max-age=300, s-maxage=300"
          done
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/${PREFIX}/latest/*" > /dev/null

          {
            echo "### design system CDN updated (${VERSION})"
            echo ""
            echo "- latest: ${PUBLIC_BASE}/${PREFIX}/latest/lib/canvas.js"
            echo "- immutable: ${PUBLIC_BASE}/${PREFIX}/${VERSION}/lib/canvas.js"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the CDN serves this version
        if: steps.secrets.outputs.present == 'true'
        run: |
          set -euo pipefail
          for FILE in lib/tokens.css lib/canvas.js lib/settings.js lib/audience.js; do
            for i in 1 2 3 4 5; do
              if curl -fsS "${PUBLIC_BASE}/${PREFIX}/latest/${FILE}" | cmp -s - "$FILE"; then
                echo "latest/${FILE} matches."
                continue 2
              fi
              echo "latest/${FILE} not updated yet (attempt $i), retrying in 20s"
              sleep 20
            done
            echo "::error::${PUBLIC_BASE}/${PREFIX}/latest/${FILE} does not match this commit after the invalidation."
            exit 1
          done
