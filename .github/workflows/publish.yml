name: publish

# Publishes @ahaslides-product/design to GitHub Packages when a version tag is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
# The tag SHOULD match "version" in package.json (npm publish uses package.json's version).
#
# No maintainer setup required: GITHUB_TOKEN is issued automatically to the workflow.
# The package scope must match the repository owner (ahaslides-product) — that is a
# GitHub Packages requirement, not a preference.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ahaslides-product'

      - run: npm install --no-audit --no-fund

      # Pre-publish gate (deterministic, no browser): the contract must generate AND
      # every component must pass the reusability/import standard before anything ships.
      - name: Build + standards gate
        run: node build-icons.mjs && node generate.mjs && node standards.mjs

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
