name: publish

# Publishes @ahaslides-product/design to GitHub Packages AUTOMATICALLY on every merge to
# master — no manual tagging. The standards gate already forces a version bump per PR; this
# workflow turns that bump into a published release so the registry can never drift behind
# master again (the failure that stranded 0.42→0.53 unpublished while master moved on).
#
# How it works: on a push to master it reads `version` from package.json and publishes ONLY
# if no matching v<version> tag exists yet (idempotent — a push that didn't bump the version
# is a no-op), then creates the v<version> tag as the release record and verifies the version
# is resolvable in the registry.
#
# Manual re-publish / backfill: run this workflow via workflow_dispatch (Actions tab) on master.
#
# Publishing needs no extra secret: GitHub Packages publish uses the built-in GITHUB_TOKEN
# (`packages: write`). `contents: write` is needed to push the version tag. The consumer bump
# PRs (bump-consumers job) need DS_BUMP_TOKEN. Consumers install with a scoped .npmrc pointing
# at https://npm.pkg.github.com + a token with read:packages
# (see the docs site "Get started" block / any agent.json).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # push the v<version> tag
  packages: write   # publish to GitHub Packages

# Never publish two runs concurrently; let an in-flight publish finish rather than cancel it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      consumers: ${{ steps.consumers.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so the "already published?" check is accurate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ahaslides-product'

      - run: npm install --no-audit --no-fund

      # Pre-publish gate (deterministic, no browser): the contract must generate AND
      # every component must pass the reusability/import standard before anything ships.
      - name: Build + standards gate
        run: node build-icons.mjs && node generate.mjs && node standards.mjs

      # Publish only when package.json's version has no matching tag yet. This makes
      # merge == publish, idempotently: a merge that bumped the version ships; a merge that
      # didn't (docs-only follow-up, etc.) is a clean no-op.
      - name: Decide whether to publish
        id: decide
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already tagged — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the consumer app list
        id: consumers
        run: echo "list=$(jq -c . .github/ds-consumers.json)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        if: steps.decide.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the published version
        if: steps.decide.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Gate: prove the version is actually resolvable in the registry after publishing, so a
      # silent publish failure turns the run red instead of leaving a phantom "shipped" version.
      # Brief retry absorbs GitHub Packages propagation delay.
      - name: Verify published
        if: steps.decide.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          for i in 1 2 3 4 5; do
            if npm view "@ahaslides-product/design@$VERSION" version; then
              echo "Verified @ahaslides-product/design@$VERSION in the registry."
              exit 0
            fi
            echo "Not visible yet (attempt $i) — retrying in 5s…"
            sleep 5
          done
          echo "::error::@ahaslides-product/design@$VERSION did not resolve in the registry after publish."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a real release, open or refresh ONE bump PR per consumer app (.github/ds-consumers.json).
  # Never auto-merged: each app's team merges its own PR. GITHUB_TOKEN can neither push to other
  # repos nor open PRs that trigger their CI, so this needs DS_BUMP_TOKEN: a classic PAT (or bot
  # account PAT) with `repo` + `read:packages` that can write to every consumer repo.
  bump-consumers:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.publish.outputs.consumers) }}
    name: bump ${{ matrix.consumer.repo }}
    env:
      DS_BUMP_TOKEN: ${{ secrets.DS_BUMP_TOKEN }}
    steps:
      - name: Check for DS_BUMP_TOKEN
        id: token
        run: |
          if [ -z "$DS_BUMP_TOKEN" ]; then
            echo "::warning::DS_BUMP_TOKEN is not set, so no bump PR was opened for ${{ matrix.consumer.repo }}. An org admin must add it (classic PAT with repo + read:packages, write access to every consumer)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the design system at the release tag
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.publish.outputs.version }}
          path: design

      - name: Check out ${{ matrix.consumer.repo }}@${{ matrix.consumer.base }}
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          ref: ${{ matrix.consumer.base }}
          token: ${{ secrets.DS_BUMP_TOKEN }}
          path: consumer

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Registry auth for @ahaslides-product
        if: steps.token.outputs.present == 'true'
        run: |
          {
            echo "@ahaslides-product:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${DS_BUMP_TOKEN}"
          } > "$HOME/.npmrc"

      - name: Enable pnpm
        if: steps.token.outputs.present == 'true' && matrix.consumer.package_manager == 'pnpm'
        run: corepack enable pnpm

      - name: Bump, push ds/auto-bump, open or update the PR
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.DS_BUMP_TOKEN }}
          REPO: ${{ matrix.consumer.repo }}
          BASE: ${{ matrix.consumer.base }}
          PACKAGE_DIR: ${{ matrix.consumer.package_dir }}
          LOCKFILE_DIR: ${{ matrix.consumer.lockfile_dir }}
          PACKAGE_MANAGER: ${{ matrix.consumer.package_manager }}
          LOCKFILE: ${{ matrix.consumer.lockfile }}
        run: design/.github/scripts/bump-consumer.sh "$GITHUB_WORKSPACE/consumer" "$GITHUB_WORKSPACE/design" "${{ needs.publish.outputs.version }}"
