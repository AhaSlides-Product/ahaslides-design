<nav class="ncb" aria-label="Presenter controls">
  <aha-tooltip size="lg" text="Timer" shortcut="T">
    <aha-button variant="secondary" size="md" icon-only aria-label="Timer (T)"><aha-icon name="system-timer" size="16"></aha-icon></aha-button>
  </aha-tooltip>
  <aha-tooltip size="lg" text="Annotate" shortcut="D">
    <aha-button class="annotate-trigger" variant="secondary" size="md" icon-only aria-label="Annotate (D)" aria-haspopup="dialog"><aha-icon name="system-pen" size="16"></aha-icon></aha-button>
  </aha-tooltip>
  <aha-popover class="annotate-picker" placement="top" hidden>
    <aha-button variant="secondary" size="sm">Pen</aha-button>
    <aha-button variant="secondary" size="sm">Highlighter</aha-button>
    <aha-button variant="secondary" size="sm">Eraser</aha-button>
  </aha-popover>
</nav>
<script type="module">
  const trigger = document.querySelector('.annotate-trigger');
  const picker = document.querySelector('.annotate-picker');
  const open = () => { picker.hidden = false; picker.querySelector('aha-button').focus(); };
  const close = () => { picker.hidden = true; trigger.focus(); };
  trigger.addEventListener('click', () => (picker.hidden ? open() : close()));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.stopPropagation();
      if (!picker.hidden) return close();
      return exitPresenting();
    }
    if (e.key === 't') startTimer();
    if (e.key === 'd') open();
  });
</script>
